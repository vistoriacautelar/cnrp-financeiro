<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e293b">
<title>Vistoria Cautelar Financeiro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#f1f5f9;color:#1e293b;-webkit-font-smoothing:antialiased}
input:focus,select:focus,textarea:focus{border-color:#3b82f6!important;box-shadow:0 0 0 3px rgba(59,130,246,.12);outline:none}
button{cursor:pointer;font-family:inherit}
.hdr{background:linear-gradient(135deg,#1e293b,#334155);padding:14px 20px;border-bottom:3px solid #3b82f6;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:800;color:#fff;letter-spacing:1px}
.logo span{font-weight:400;font-size:12px;color:#94a3b8}
.nav{display:flex;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10}
.nb{flex:1;padding:8px 4px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;color:#64748b;border-bottom:2px solid transparent;transition:all .15s;position:relative;font-size:11px;font-weight:600}
.nb.act{color:#3b82f6;border-bottom-color:#3b82f6;background:#eff6ff}
.nb .ico{font-size:20px}
.bdg{position:absolute;top:0;right:10%;background:#ef4444;color:#fff;font-size:9px;font-weight:700;border-radius:99px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.main{max-width:780px;margin:0 auto;padding:16px 16px 80px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.st{font-size:19px;font-weight:800;color:#0f172a}
.help{font-size:12px;color:#64748b;margin:-4px 0 10px;line-height:1.4}
.pri{padding:8px 16px;background:#3b82f6;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600}
.sec{padding:8px 16px;background:#10b981;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600}
.warn-btn{padding:8px 16px;background:#f59e0b;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600}
.can{padding:8px 16px;background:#f1f5f9;color:#475569;border:1px solid #d1d5db;border-radius:7px;font-size:13px}
.dan{padding:8px 16px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:7px;font-size:13px;font-weight:600}
.fc{background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 6px rgba(0,0,0,.07);margin-bottom:14px}
.lb{display:block;font-size:12px;font-weight:600;color:#374151;margin:8px 0 3px}
.inp,.sel{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:14px;background:#fff}
.row{display:flex;gap:10px;align-items:flex-end}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.lc{background:#fff;border-radius:9px;padding:11px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lh{display:flex;justify-content:space-between;align-items:flex-start}
.tg{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;margin-right:6px}
.sm{background:none;border:none;font-size:17px;padding:2px;cursor:pointer}
.emp{text-align:center;padding:28px 16px;color:#94a3b8;font-size:13px;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.cd{background:#fff;border-radius:9px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kl{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.kv{font-size:17px;font-weight:800;color:#0f172a;margin:2px 0}
.ks{font-size:11px;color:#94a3b8}
.al-r{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px;margin-bottom:14px}
.al-y{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px;margin-bottom:14px}
.al-i{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #fecaca;gap:8px;flex-wrap:wrap}
.al-btn{padding:4px 9px;background:#dc2626;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.ok-b{display:flex;align-items:center;gap:10px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;margin-bottom:12px}
.status-pago{background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700}
.status-pend{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700}
.nf-thumb{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #e2e8f0;cursor:pointer}
.nf-upload{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;cursor:pointer}
.nf-upload:hover{background:#eff6ff;border-color:#93c5fd}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto}
.report-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:12px;line-height:1.6;white-space:pre-wrap;font-family:'Courier New',monospace}
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:32px 24px;box-shadow:0 4px 20px rgba(0,0,0,.1);max-width:360px;width:100%;text-align:center}
.sync-badge{font-size:9px;background:#dbeafe;color:#1d4ed8;padding:1px 6px;border-radius:4px;font-weight:600}
#app{display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div style="font-size:40px;margin-bottom:8px">💰</div>
    <h1 style="font-size:20px;font-weight:800;margin-bottom:4px">Vistoria Cautelar Financeiro</h1>
    <p style="font-size:12px;color:#64748b;margin-bottom:20px">Controle de medições, despesas e faturamento</p>
    <input class="inp" id="login-email" type="email" placeholder="Email" style="margin-bottom:8px">
    <input class="inp" id="login-pass" type="password" placeholder="Senha" style="margin-bottom:12px">
    <button class="pri" style="width:100%;padding:10px" onclick="doLogin()">Entrar</button>
    <p id="login-err" style="color:#dc2626;font-size:12px;margin-top:8px;display:none"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
<header class="hdr">
  <div class="logo">Vistoria Cautelar<span> Financeiro</span></div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="sync-status" class="sync-badge">offline</span>
    <button style="background:none;border:none;color:#94a3b8;font-size:14px" onclick="doLogout()">Sair</button>
  </div>
</header>
<nav class="nav" id="nav"></nav>
<main class="main">
  <div id="tab-painel" class="tab-content"></div>
  <div id="tab-fat" class="tab-content" style="display:none"></div>
  <div id="tab-saidas" class="tab-content" style="display:none"></div>
  <div id="tab-fixos" class="tab-content" style="display:none"></div>
  <div id="tab-config" class="tab-content" style="display:none"></div>
</main>
</div>
<div id="modal-container"></div>

// ═══════ DATA ═══════
let DB={medicoes:[],saidas:[],obrigacoes:[],provisoes:[],veiculos:[],faturamento:[],precoLitro:0,ajudaCustoVeiculo:1000};
const DOC_REF=doc(firestore,'financeiro','data');
let unsubSnap=null;

async function saveDB(){
  try{await setDoc(DOC_REF,{...DB,updatedAt:new Date().toISOString()},{merge:false});
  document.getElementById('sync-status').textContent='sincronizado';
  document.getElementById('sync-status').style.background='#d1fae5';
  document.getElementById('sync-status').style.color='#065f46';
  }catch(e){console.error('Save error:',e);
  document.getElementById('sync-status').textContent='erro sync';
  document.getElementById('sync-status').style.background='#fecaca';
  document.getElementById('sync-status').style.color='#991b1b';}
}

function startSync(){
  unsubSnap=onSnapshot(DOC_REF,(snap)=>{
    if(snap.exists()){
      const d=snap.data();
      DB.medicoes=d.medicoes||[];DB.saidas=d.saidas||[];DB.obrigacoes=d.obrigacoes||[];
      DB.provisoes=d.provisoes||[];DB.veiculos=d.veiculos||[];DB.faturamento=d.faturamento||[];
      DB.precoLitro=d.precoLitro||0;DB.ajudaCustoVeiculo=d.ajudaCustoVeiculo??1000;
      document.getElementById('sync-status').textContent='sincronizado';
      document.getElementById('sync-status').style.background='#d1fae5';
      document.getElementById('sync-status').style.color='#065f46';
      render();
    }else{importInitial();}
  },(err)=>{console.error('Snap error:',err);
    document.getElementById('sync-status').textContent='offline';});
}

// ═══════ AUTH ═══════
window.doLogin=async function(){
  const email=document.getElementById('login-email').value;
  const pass=document.getElementById('login-pass').value;
  const errEl=document.getElementById('login-err');
  try{errEl.style.display='none';await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){errEl.textContent='Email ou senha incorretos';errEl.style.display='block';}
};
window.doLogout=function(){if(unsubSnap)unsubSnap();signOut(auth);};

onAuthStateChanged(auth,(user)=>{
  if(user){document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='block';startSync();}
  else{document.getElementById('login-screen').style.display='flex';document.getElementById('app').style.display='none';if(unsubSnap)unsubSnap();}
});

// ═══════ FILE UPLOAD ═══════
window.uploadNF=async function(fatId){
  const input=document.createElement('input');input.type='file';input.accept='image/*,application/pdf';
  input.onchange=async function(){
    const file=input.files[0];if(!file)return;
    const path=`financeiro/notas/${fatId}/${file.name}`;
    const storageRef=sRef(storage,path);
    try{
      document.getElementById('upload-status-'+fatId).textContent='Enviando...';
      await uploadBytes(storageRef,file);
      const url=await getDownloadURL(storageRef);
      // Save URL in faturamento
      DB.faturamento=DB.faturamento.map(f=>{
        if(f.id===fatId){const arquivos=f.arquivos||[];arquivos.push({nome:file.name,url,path,dt:new Date().toISOString()});return{...f,arquivos};}
        return f;
      });
      await saveDB();
      document.getElementById('upload-status-'+fatId).textContent='✅ Enviado!';
      setTimeout(()=>render(),1000);
    }catch(e){console.error('Upload error:',e);document.getElementById('upload-status-'+fatId).textContent='❌ Erro: '+e.message;}
  };
  input.click();
};

window.delNF=async function(fatId,path,idx){
  if(!confirm('Excluir este arquivo?'))return;
  try{await deleteObject(sRef(storage,path));}catch(e){console.log('File may not exist:',e);}
  DB.faturamento=DB.faturamento.map(f=>{if(f.id===fatId){const a=[...(f.arquivos||[])];a.splice(idx,1);return{...f,arquivos:a};}return f;});
  await saveDB();
};

// ═══════ HELPERS ═══════
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=v=>(v==null||isNaN(v))?'R$ 0,00':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtD=d=>{if(!d||d==='NaT')return'—';try{return new Date(d+'T12:00').toLocaleDateString('pt-BR')}catch{return d}};
const parseBRL=s=>{if(!s)return 0;return parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0};
const calcComb=(km,kml,vl)=>(km&&kml&&vl&&kml>0)?(km/kml)*vl:0;
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad=n=>String(n).padStart(2,'0');
function getPeriodos(start,end){const ps=[];let d=new Date(start+'T12:00:00');const e=new Date(end+'T12:00:00');while(d<=e){const n=new Date(d);n.setMonth(n.getMonth()+1);ps.push({inicio:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),label:pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' → '+pad(n.getDate())+'/'+pad(n.getMonth()+1)+'/'+n.getFullYear()});d=n;}return ps;}
function getTot(sd){const v=DB.veiculos.find(x=>x.id===sd.veiculoId);return(v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0))+(sd.pedagio||0)+(sd.refeicao||0)+(sd.outros||0);}

// ═══════ PAINEL ═══════
function renderPainel(){
  const el=document.getElementById('tab-painel');const alertas=[];
  DB.obrigacoes.filter(o=>o.ativo).forEach(ob=>{
    const totalParc=ob.totalParcelas||0;
    const provCount=DB.provisoes.filter(pv=>pv.obrigacaoId===ob.id).length;
    if(totalParc>0&&provCount>=totalParc)return; // quitado, skip
    const endDate=totalParc>0?(()=>{const d=new Date(ob.dataInicio+'T12:00:00');d.setMonth(d.getMonth()+totalParc);return d.toISOString().slice(0,10);})():'2026-07-31';
    getPeriodos(ob.dataInicio,endDate).forEach(p=>{if(!DB.provisoes.some(pv=>pv.obrigacaoId===ob.id&&pv.periodoInicio===p.inicio))alertas.push({tipo:'p',nome:ob.nome,valor:ob.valor,periodo:p.label,pi:p.inicio,obId:ob.id});});
    const ns=new Date('2026-07-31T12:00:00');ns.setDate(new Date(ob.dataInicio+'T12:00:00').getDate());if(ns<=new Date('2026-07-31T12:00:00'))ns.setMonth(ns.getMonth()+1);const ne=new Date(ns);ne.setMonth(ne.getMonth()+1);
    const nl=pad(ns.getDate())+'/'+pad(ns.getMonth()+1)+'/'+ns.getFullYear()+' → '+pad(ne.getDate())+'/'+pad(ne.getMonth()+1)+'/'+ne.getFullYear();
    const nsPi=ns.toISOString().slice(0,10);
    if(totalParc>0){const endD=new Date(ob.dataInicio+'T12:00:00');endD.setMonth(endD.getMonth()+totalParc);if(ns>=endD)return;}
    if(!DB.provisoes.some(pv=>pv.obrigacaoId===ob.id&&pv.periodoInicio===nsPi))alertas.push({tipo:'n',nome:ob.nome,valor:ob.valor,periodo:nl,pi:nsPi,obId:ob.id});
  });
  const per=alertas.filter(a=>a.tipo==='p'),prx=alertas.filter(a=>a.tipo==='n');
  const fatP=DB.faturamento.filter(f=>f.status==='Pago').reduce((s,f)=>s+(f.valorTotal||0),0);
  const fatPend=DB.faturamento.filter(f=>f.status!=='Pago').reduce((s,f)=>s+(f.valorTotal||0),0);
  const tS=DB.saidas.reduce((s,x)=>s+getTot(x),0);
  let h='';
  if(per.length>0){h+=`<div class="al-r"><h3 style="margin:0 0 4px;font-size:13px;color:#991b1b">⚠️ Provisão pendente (${per.length})</h3>`;
    per.forEach(a=>{h+=`<div class="al-i"><div><strong style="font-size:12px">${esc(a.nome)}</strong><div style="font-size:10px;color:#6b7280">${a.periodo}</div><div style="font-weight:700;color:#dc2626;font-size:13px">${fmt(a.valor)}</div></div><button class="al-btn" onclick="provM('${a.obId}','${a.pi}','${a.periodo}',${a.valor})">Provisionar</button></div>`;});h+=`</div>`;}
  else h+=`<div class="ok-b"><span style="font-size:20px">✅</span><div><strong>Provisões em dia</strong></div></div>`;
  if(prx.length>0){h+=`<div class="al-y"><h3 style="margin:0 0 6px;font-size:13px;color:#92400e">📅 Próximo ciclo</h3>`;
    prx.forEach(a=>{h+=`<div class="al-i" style="border-color:#fde68a"><div><strong style="font-size:12px">${esc(a.nome)}</strong><div style="font-size:10px;color:#6b7280">${a.periodo}</div><div style="font-weight:700;color:#92400e">${fmt(a.valor)}</div></div><button class="al-btn" style="background:#f59e0b" onclick="provM('${a.obId}','${a.pi}','${a.periodo}',${a.valor})">Provisionar</button></div>`;});h+=`</div>`;}
  h+=`<div class="g3"><div class="cd" style="border-left:3px solid #10b981"><div class="kl">Recebido</div><div class="kv" style="font-size:14px;color:#059669">${fmt(fatP)}</div></div>
  <div class="cd" style="border-left:3px solid #f59e0b"><div class="kl">Pendente</div><div class="kv" style="font-size:14px;color:#b45309">${fmt(fatPend)}</div></div>
  <div class="cd" style="border-left:3px solid #f97316"><div class="kl">Despesas</div><div class="kv" style="font-size:14px">${fmt(tS)}</div></div></div>`;
  el.innerHTML=h;
}

function renderFat(){
  const el=document.getElementById('tab-fat');
  const pagos=DB.faturamento.filter(f=>f.status==='Pago');
  const pend=DB.faturamento.filter(f=>f.status!=='Pago');
  let h=`<div class="sh"><h2 class="st">Faturamento</h2><button class="pri" onclick="novoFat()">+ Novo</button></div>
  <div class="g2"><div class="cd" style="border-left:3px solid #10b981"><div class="kl">Recebido</div><div class="kv" style="font-size:14px;color:#059669">${fmt(pagos.reduce((s,f)=>s+f.valorTotal,0))}</div><div class="ks">${pagos.length} medições</div></div>
  <div class="cd" style="border-left:3px solid #f59e0b"><div class="kl">Pendente</div><div class="kv" style="font-size:14px;color:#b45309">${fmt(pend.reduce((s,f)=>s+f.valorTotal,0))}</div><div class="ks">${pend.length} medições</div></div></div>`;

  [...pend,...pagos].forEach(f=>{
    const isPago=f.status==='Pago';

    const ss=med?DB.saidas.filter(s=>s.medicaoId===med.id).sort((a,b)=>(a.data||'').localeCompare(b.data||'')):[];
    let totComb=0,totPed=0,totRef=0,totDesp=0;
    ss.forEach(sd=>{const v=DB.veiculos.find(x=>x.id===sd.veiculoId);const c=v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0);totComb+=c;totPed+=(sd.pedagio||0);totRef+=(sd.refeicao||0);totDesp+=c+(sd.pedagio||0)+(sd.refeicao||0)+(sd.outros||0);});
    const imposto=f.imposto||0;
    const ajuda=DB.ajudaCustoVeiculo||0;
    const provs=DB.provisoes.filter(p=>{const ob=DB.obrigacoes.find(o=>o.id===p.obrigacaoId);return ob&&(p.ref||'').toLowerCase().includes(cl.toLowerCase().slice(0,4));});
    const totProvPrev=provs.reduce((s,p)=>s+p.valor,0);
    const totProvReal=provs.reduce((s,p)=>s+(p.valorReal!=null?p.valorReal:p.valor),0);
    const provDiff=totProvPrev-totProvReal;
    const totalDespFull=totDesp+imposto+totProvReal+ajuda;
    const valorPag=f.valorTotal-imposto;
    const liq=valorPag-totDesp-totProvReal-ajuda;
    const metade=liq/2;
    const tatRec=metade+totDesp+ajuda+totProvReal;
    const ronRec=metade-ajuda;
    const fv=v=>(v==null||isNaN(v))?'0,00':v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

    h+=`<div class="lc" style="border-left:3px solid ${isPago?'#10b981':'#f59e0b'}">
      <div class="lh" style="cursor:pointer" onclick="toggleDetail('${f.id}')"><div><span class="tg" style="background:#dbeafe;color:#1d4ed8">${esc(cl)}</span><span style="font-size:12px;font-weight:600">${esc(f.mesRef)}</span></div>
      <div style="display:flex;gap:3px;align-items:center"><strong style="font-size:13px">${fmt(f.valorTotal)}</strong><span class="${isPago?'status-pago':'status-pend'}">${esc(f.status)}</span>
      <button class="sm" onclick="event.stopPropagation();toggleFat('${f.id}')">${isPago?'↩️':'✅'}</button><button class="sm" onclick="event.stopPropagation();editFat('${f.id}')">✏️</button><button class="sm" onclick="event.stopPropagation();gerarResumo('${f.id}')">📄</button></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:4px;font-size:11px;color:#64748b">
        ${f.nf?`<span>NF: <strong>${esc(f.nf)}</strong></span>`:''}
        ${f.envioMedicao&&f.envioMedicao!=='NaT'?`<span>📤 Envio: ${fmtD(f.envioMedicao)}</span>`:''}
        ${f.emissaoNF&&f.emissaoNF!=='NaT'?`<span>Emissão: ${fmtD(f.emissaoNF)}</span>`:''}
        ${f.prevPagamento&&f.prevPagamento!=='NaT'?`<span>Prev: ${fmtD(f.prevPagamento)}</span>`:''}
        ${f.dataDeposito&&f.dataDeposito!=='NaT'?`<span>Depósito: ${fmtD(f.dataDeposito)}</span>`:''}
      </div>
      ${f.obs?`<div style="font-size:10px;color:#b45309;margin-top:2px">⚠️ ${esc(f.obs)}</div>`:''}`;

    // ── Expandable detail panel ──
    h+=`<div id="det-${f.id}" style="display:none;margin-top:8px;border-top:1px solid #e2e8f0;padding-top:8px">`;
    if(ss.length){
      h+=`<div style="font-size:11px;font-weight:700;color:#334155;margin-bottom:4px">🚗 Saídas de campo (${ss.length})</div>
      <table style="width:100%;border-collapse:collapse;font-size:10px;margin-bottom:8px">
      <tr style="background:#f1f5f9;color:#475569"><th style="padding:2px 4px;text-align:left">Data</th><th style="padding:2px 4px;text-align:left">Local</th><th style="padding:2px 4px;text-align:right">⛽</th><th style="padding:2px 4px;text-align:right">🛣️</th><th style="padding:2px 4px;text-align:right">🍽️</th><th style="padding:2px 4px;text-align:right">Total</th></tr>`;
      ss.forEach((sd,i)=>{const v=DB.veiculos.find(x=>x.id===sd.veiculoId);const c=v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0);const t=c+(sd.pedagio||0)+(sd.refeicao||0)+(sd.outros||0);
        h+=`<tr style="background:${i%2?'#f8fafc':'#fff'}"><td style="padding:2px 4px">${fmtD(sd.data)}</td><td style="padding:2px 4px">${esc(sd.local)}</td><td style="padding:2px 4px;text-align:right">${fv(c)}</td><td style="padding:2px 4px;text-align:right">${fv(sd.pedagio)}</td><td style="padding:2px 4px;text-align:right">${fv(sd.refeicao)}</td><td style="padding:2px 4px;text-align:right;font-weight:600">${fv(t)}</td></tr>`;});
      h+=`<tr style="background:#e2e8f0;font-weight:700;font-size:10px"><td colspan="2" style="padding:2px 4px">TOTAL</td><td style="padding:2px 4px;text-align:right">${fv(totComb)}</td><td style="padding:2px 4px;text-align:right">${fv(totPed)}</td><td style="padding:2px 4px;text-align:right">${fv(totRef)}</td><td style="padding:2px 4px;text-align:right">${fv(totDesp)}</td></tr></table>`;
    }else{h+=`<div style="font-size:11px;color:#94a3b8;margin-bottom:6px">Nenhuma saída vinculada.</div>`;}

    h+=`<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px;font-size:11px;line-height:1.8">
    <div style="font-weight:700;color:#334155;margin-bottom:2px">💰 Resumo financeiro</div>
    <div style="display:flex;justify-content:space-between"><span>Despesas Tatiana</span><span>${fv(totDesp)}</span></div>
    <div style="display:flex;justify-content:space-between"><span>Imposto medição</span><span>${fv(imposto)}</span></div>`;
    if(provs.length>0)provs.forEach(p=>{const ob=DB.obrigacoes.find(o=>o.id===p.obrigacaoId);const tp=ob?.tipo==='reembolso'?'💳':'👷';const vr=p.valorReal!=null?p.valorReal:p.valor;const d=p.valor-vr;
      h+=`<div style="display:flex;justify-content:space-between"><span>${tp} ${esc(ob?ob.nome:'Func.')}</span><span>${p.valorReal!=null?`<span style="text-decoration:line-through;color:#94a3b8;font-size:10px;margin-right:3px">${fv(p.valor)}</span>${fv(vr)}`:fv(p.valor)}</span></div>`;
      if(d>0)h+=`<div style="display:flex;justify-content:space-between;font-size:10px;color:#1d4ed8"><span style="padding-left:16px">↩ devolvido ao pool</span><span>+${fv(d)}</span></div>`;});
    h+=`<div style="display:flex;justify-content:space-between"><span>Ajuda custo veículo</span><span>${fv(ajuda)}</span></div>
    <div style="display:flex;justify-content:space-between;border-top:1px solid #cbd5e1;padding-top:3px;margin-top:3px;font-weight:700"><span>Total despesas</span><span>${fv(totalDespFull)}</span></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px"><span>Medição bruta</span><span>${fv(f.valorTotal)}</span></div>
    <div style="display:flex;justify-content:space-between"><span>Pagamento (−imposto)</span><span>${fv(valorPag)}</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;color:#059669"><span>Líquido</span><span>${fv(liq)}</span></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:4px;border-top:1px solid #cbd5e1"><span style="font-weight:600;color:#059669">Tatiana</span><span style="font-weight:700;color:#059669">${fv(tatRec)}</span></div>
    <div style="display:flex;justify-content:space-between"><span style="font-weight:600;color:#1d4ed8">Ronaldo</span><span style="font-weight:700;color:#1d4ed8">${fv(ronRec)}</span></div>
    </div></div>`;

    // Arquivos NF
    if(arqs.length>0){
      h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">`;
      arqs.forEach((a,i)=>{
        const isImg=a.nome.match(/\.(jpg|jpeg|png|gif|webp)$/i);
        h+=`<div style="position:relative">${isImg?`<img src="${a.url}" class="nf-thumb" onclick="viewFile('${a.url}')">`:`<div class="nf-thumb" style="display:flex;align-items:center;justify-content:center;font-size:20px;background:#f1f5f9" onclick="viewFile('${a.url}')">📄</div>`}
        <button style="position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center" onclick="delNF('${f.id}','${a.path}',${i})">✕</button></div>`;
      });
      h+=`</div>`;
    }
    h+=`<div class="nf-upload" onclick="uploadNF('${f.id}')"><span>📎</span><span style="font-size:12px;color:#64748b">Anexar NF / documento</span><span id="upload-status-${f.id}" style="font-size:10px"></span></div></div>`;
  });
  el.innerHTML=h;
}

};

// ═══════ RESUMO (estilo planilha Excel) ═══════
window.gerarResumo=function(fatId){
  const f=DB.faturamento.find(x=>x.id===fatId);if(!f)return;
  const cl=f.clienteNorm||f.cliente;
  const med=DB.medicoes.find(m=>m.consorcio===cl&&f.mesRef&&f.mesRef.includes(m.mesRef));
  const ss=med?DB.saidas.filter(s=>s.medicaoId===med.id).sort((a,b)=>(a.data||'').localeCompare(b.data||'')):[];

  // Totais por categoria
  let totComb=0,totPed=0,totRef=0,totGeral=0;
  ss.forEach(sd=>{
    const v=DB.veiculos.find(x=>x.id===sd.veiculoId);
    const c=v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0);
    totComb+=c;totPed+=(sd.pedagio||0);totRef+=(sd.refeicao||0);
    totGeral+=c+(sd.pedagio||0)+(sd.refeicao||0)+(sd.outros||0);
  });

  // Imposto — pega do faturamento ou da medição
  const imposto=f.imposto||0||(med?med.imposto||0:0);

  // Provisão David (obrigações do período)
  const provs=DB.provisoes.filter(p=>{
    const ob=DB.obrigacoes.find(o=>o.id===p.obrigacaoId);
    return ob&&(p.ref||'').toLowerCase().includes(cl.toLowerCase().slice(0,4));
  });
  const totProvPrev=provs.reduce((s,p)=>s+p.valor,0);
  const totProvReal=provs.reduce((s,p)=>s+(p.valorReal!=null?p.valorReal:p.valor),0);
  const provDiff=totProvPrev-totProvReal;

  // Ajuda de custo veículo
  const ajudaCusto=DB.ajudaCustoVeiculo||0;

  // Cálculos (usa gasto REAL quando disponível)
  const despTatiana=totGeral;
  const totalDespesas=despTatiana+imposto+totProvReal+ajudaCusto;
  const valorPagamento=f.valorTotal-imposto;
  const valorLiquido=valorPagamento-despTatiana-totProvReal-ajudaCusto;

  // Divisão 50/50
  const metade=valorLiquido/2;
  const tatianaRecebe=metade+despTatiana+ajudaCusto+totProvReal;
  const ronaldoRecebe=metade-ajudaCusto;

  // Gerar HTML do resumo estilo planilha
  const fv=v=>(v==null||isNaN(v))?'0,00':v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

  let html=`<div style="font-family:'Courier New',monospace;font-size:12px;line-height:1.7;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;overflow-x:auto">
  <div style="text-align:center;font-weight:700;font-size:14px;margin-bottom:10px;border-bottom:2px solid #334155;padding-bottom:6px">ACERTO ${esc(cl.toUpperCase())} — Medição ${esc(f.mesRef)}</div>`;

  // Tabela de saídas
  if(ss.length){
    html+=`<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px">
    <tr style="background:#334155;color:#fff;text-align:left"><th style="padding:3px 5px">Dias</th><th style="padding:3px 5px">Local</th><th style="padding:3px 5px;text-align:right">Combustível</th><th style="padding:3px 5px;text-align:right">Pedágio</th><th style="padding:3px 5px;text-align:right">Refeição</th><th style="padding:3px 5px;text-align:right">Total</th></tr>`;
    ss.forEach((sd,i)=>{
      const v=DB.veiculos.find(x=>x.id===sd.veiculoId);
      const c=v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0);
      const t=c+(sd.pedagio||0)+(sd.refeicao||0)+(sd.outros||0);
      const bg=i%2===0?'#fff':'#f1f5f9';
      html+=`<tr style="background:${bg}"><td style="padding:3px 5px">${fmtD(sd.data)}</td><td style="padding:3px 5px">${esc(sd.local)}</td><td style="padding:3px 5px;text-align:right">${fv(c)}</td><td style="padding:3px 5px;text-align:right">${fv(sd.pedagio)}</td><td style="padding:3px 5px;text-align:right">${fv(sd.refeicao)}</td><td style="padding:3px 5px;text-align:right;font-weight:600">${fv(t)}</td></tr>`;
    });
    html+=`<tr style="background:#e2e8f0;font-weight:700"><td colspan="2" style="padding:3px 5px">TOTAL</td><td style="padding:3px 5px;text-align:right">${fv(totComb)}</td><td style="padding:3px 5px;text-align:right">${fv(totPed)}</td><td style="padding:3px 5px;text-align:right">${fv(totRef)}</td><td style="padding:3px 5px;text-align:right">${fv(totGeral)}</td></tr></table>`;
  }

  // Despesas
  html+=`<div style="border:1px solid #d1d5db;border-radius:6px;padding:8px;margin-bottom:10px;background:#fff">
  <div style="font-weight:700;margin-bottom:4px;color:#334155">DESPESAS</div>
  <div style="display:flex;justify-content:space-between;padding:2px 0"><span>Despesas Tatiana</span><span>${fv(despTatiana)}</span></div>
  <div style="display:flex;justify-content:space-between;padding:2px 0"><span>Imposto medição</span><span>${fv(imposto)}</span></div>`;
  if(provs.length>0){
    provs.forEach(p=>{const ob=DB.obrigacoes.find(o=>o.id===p.obrigacaoId);const vr=p.valorReal!=null?p.valorReal:p.valor;const d=p.valor-vr;
      html+=`<div style="display:flex;justify-content:space-between;padding:2px 0"><span>${ob?.tipo==='reembolso'?'💳':'👷'} ${esc(ob?ob.nome:'Func.')}</span><span>${p.valorReal!=null?`<span style="text-decoration:line-through;color:#94a3b8;margin-right:4px">${fv(p.valor)}</span>${fv(vr)}`:fv(p.valor)}</span></div>`;
      if(d>0)html+=`<div style="display:flex;justify-content:space-between;padding:1px 0;font-size:11px;color:#1d4ed8"><span style="padding-left:12px">↩ diferença devolvida ao pool</span><span>+${fv(d)}</span></div>`;
    });
  }else{
    html+=`<div style="display:flex;justify-content:space-between;padding:2px 0"><span>Prev. Pagamento (Funcionário)</span><span>0,00</span></div>`;
  }
  html+=`<div style="display:flex;justify-content:space-between;padding:2px 0"><span>Ajuda de custo veículo</span><span>${fv(ajudaCusto)}</span></div>
  <div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid #334155;font-weight:700;margin-top:4px"><span>Total Despesas</span><span>${fv(totalDespesas)}</span></div></div>`;

  // Valores
  html+=`<div style="border:1px solid #d1d5db;border-radius:6px;padding:8px;margin-bottom:10px;background:#fff">
  <div style="display:flex;justify-content:space-between;padding:2px 0"><span>Medição</span><span style="font-weight:600">${fv(f.valorTotal)}</span></div>
  <div style="display:flex;justify-content:space-between;padding:2px 0"><span>Valor de pagamento (bruto − imposto)</span><span>${fv(valorPagamento)}</span></div>
  <div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid #334155;font-weight:700;margin-top:4px;color:#059669"><span>Valor líquido</span><span>${fv(valorLiquido)}</span></div></div>`;

  // Tabela A Receber
  html+=`<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:4px">
  <tr style="background:#334155;color:#fff"><th style="padding:4px 6px;text-align:left" colspan="2">A RECEBER</th></tr>
  <tr style="background:#f0fdf4"><td style="padding:4px 6px;font-weight:600">Tatiana</td><td style="padding:4px 6px;text-align:right;font-weight:700;color:#059669">${fv(tatianaRecebe)}</td></tr>
  <tr style="font-size:10px;color:#64748b"><td style="padding:1px 6px 1px 16px" colspan="2">50% líquido (${fv(metade)}) + reembolso desp. (${fv(despTatiana)}) + ajuda custo (${fv(ajudaCusto)})${totProvReal>0?` + obrigações (${fv(totProvReal)})`:''}</td></tr>
  <tr style="background:#eff6ff"><td style="padding:4px 6px;font-weight:600">Ronaldo</td><td style="padding:4px 6px;text-align:right;font-weight:700;color:#1d4ed8">${fv(ronaldoRecebe)}</td></tr>
  <tr style="font-size:10px;color:#64748b"><td style="padding:1px 6px 1px 16px" colspan="2">50% líquido (${fv(metade)}) − ajuda custo (${fv(ajudaCusto)})</td></tr>
  </table></div>`;

  // Texto plano para copiar
  let txt=`ACERTO ${cl.toUpperCase()} — Medição ${f.mesRef}\n\n`;
  if(ss.length){txt+=`Dias | Local | Comb. | Ped. | Ref. | Total\n${'-'.repeat(55)}\n`;
    ss.forEach(sd=>{const v=DB.veiculos.find(x=>x.id===sd.veiculoId);const c=v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0);const t=c+(sd.pedagio||0)+(sd.refeicao||0)+(sd.outros||0);
      txt+=`${fmtD(sd.data)} | ${sd.local} | ${fv(c)} | ${fv(sd.pedagio)} | ${fv(sd.refeicao)} | ${fv(t)}\n`;});
    txt+=`${'-'.repeat(55)}\nTOTAL: ${fv(totComb)} | ${fv(totPed)} | ${fv(totRef)} | ${fv(totGeral)}\n`;}
  txt+=`\nDESPESAS\nDespesas Tatiana: ${fv(despTatiana)}\nImposto medição: ${fv(imposto)}\n`;
  if(provs.length>0)provs.forEach(p=>{const ob=DB.obrigacoes.find(o=>o.id===p.obrigacaoId);const vr=p.valorReal!=null?p.valorReal:p.valor;const d=p.valor-vr;
    txt+=`${ob?ob.nome:'Func.'}: ${p.valorReal!=null?`prev. ${fv(p.valor)} → real ${fv(vr)}`:fv(p.valor)}${d>0?` (↩ ${fv(d)} devolvido)`:''}\n`;});
  txt+=`Ajuda de custo veículo: ${fv(ajudaCusto)}\nTotal Despesas: ${fv(totalDespesas)}\n`;
  txt+=`\nMedição: ${fv(f.valorTotal)}\nValor de pagamento: ${fv(valorPagamento)}\nValor líquido: ${fv(valorLiquido)}\n`;
  txt+=`\nA RECEBER\nTatiana: ${fv(tatianaRecebe)}\nRonaldo: ${fv(ronaldoRecebe)}\n`;

  document.getElementById('modal-container').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="font-size:14px;font-weight:700">📄 ${esc(cl)} — ${esc(f.mesRef)}</h3><button class="sm" style="font-size:18px" onclick="closeModal()">✕</button></div>
  ${html}
  <div class="acts" style="margin-top:10px"><button class="can" onclick="closeModal()">Fechar</button><button class="sec" onclick="copyResumo()">📋 Copiar texto</button></div></div></div>`;
  window._resumoTxt=txt;
};
window.copyResumo=function(){navigator.clipboard.writeText(window._resumoTxt).then(()=>alert('Copiado!')).catch(()=>{const ta=document.createElement('textarea');ta.value=window._resumoTxt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Copiado!');});};
window.closeModal=function(){document.getElementById('modal-container').innerHTML='';};

// ═══════ SAÍDAS ═══════
let sfCliente='',sfMed='';
function renderSaidas(){
  const el=document.getElementById('tab-saidas');
  const clientes=[...new Set(DB.medicoes.map(m=>m.consorcio))].sort();
  const mesesDoCliente=sfCliente?DB.medicoes.filter(m=>m.consorcio===sfCliente).sort((a,b)=>(a.mesRef||'').localeCompare(b.mesRef||'')):[];

  let h=`<div class="sh"><h2 class="st">Saídas de campo</h2><button class="pri" onclick="novaSaida()">+ Nova</button></div>
  <div class="row" style="margin-bottom:10px">
  <div style="flex:1"><label class="lb">Cliente</label><select class="sel" onchange="sfCliente=this.value;sfMed='';renderSaidas()"><option value="">Todos</option>${clientes.map(c=>`<option value="${esc(c)}"${sfCliente===c?' selected':''}>${esc(c)}</option>`).join('')}</select></div>
  <div style="flex:1"><label class="lb">Medição</label><select class="sel" onchange="sfMed=this.value;renderSaidas()"${!sfCliente?' disabled':''}><option value="">Todas</option>${mesesDoCliente.map(m=>`<option value="${m.id}"${sfMed===m.id?' selected':''}>${esc(m.mesRef)}</option>`).join('')}</select></div></div>`;

  const fl=DB.saidas.filter(x=>{
    if(!sfCliente&&!sfMed)return true;
    if(sfMed)return x.medicaoId===sfMed;
    if(sfCliente){const mids=DB.medicoes.filter(m=>m.consorcio===sfCliente).map(m=>m.id);return mids.includes(x.medicaoId);}
    return true;
  }).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  let tF=fl.reduce((s,sd)=>s+getTot(sd),0);
  if(fl.length)h+=`<div class="cd" style="margin-bottom:8px;border-left:3px solid #f97316"><div class="kl">${fl.length} saídas</div><div class="kv" style="font-size:16px">${fmt(tF)}</div></div>`;
  fl.slice(0,50).forEach(sd=>{const tot=getTot(sd);const v=DB.veiculos.find(x=>x.id===sd.veiculoId);const comb=v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0);
    const medNm=sd.medicaoId?DB.medicoes.find(m=>m.id===sd.medicaoId):null;
    h+=`<div class="lc" style="border-left:3px solid ${sd.reembolsado?'#10b981':'#f97316'}"><div class="lh"><div><span class="tg" style="background:#fce7f3;color:#9d174d">${esc(sd.quemPagou||'Tatiana')}</span><span style="font-size:13px;font-weight:600">${fmtD(sd.data)}</span></div>
    <div style="display:flex;gap:4px;align-items:center"><strong style="font-size:14px">${fmt(tot)}</strong><button class="sm" onclick="delSd('${sd.id}')">🗑️</button></div></div>
    <div style="font-size:13px;color:#475569;margin-top:3px">📍 ${esc(sd.local)}${medNm?` <span style="font-size:11px;color:#3b82f6;font-weight:600">· ${esc(medNm.consorcio)} ${esc(medNm.mesRef)}</span>`:''}</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:13px;color:#475569">${comb>0?`<span>⛽ ${fmt(comb)}</span>`:''}${sd.pedagio>0?`<span>🛣️ ${fmt(sd.pedagio)}</span>`:''}${sd.refeicao>0?`<span>🍽️ ${fmt(sd.refeicao)}</span>`:''}</div></div>`;
  });
  if(!fl.length)h+=`<div class="emp">Nenhuma saída.</div>`;
  el.innerHTML=h;
}

function renderFixos(){
  const el=document.getElementById('tab-fixos');
  let h=`<div class="sh"><h2 class="st">Obrigações</h2><button class="pri" onclick="novaOb()">+ Nova</button></div>`;
  DB.obrigacoes.forEach(o=>{
    const ps=DB.provisoes.filter(p=>p.obrigacaoId===o.id).sort((a,b)=>a.periodoInicio.localeCompare(b.periodoInicio));
    const tipo=o.tipo||'funcionario';
    const totalParc=o.totalParcelas||0;
    const tipoBg=tipo==='reembolso'?'background:#dbeafe;color:#1d4ed8':'background:#fef3c7;color:#92400e';
    const tipoLabel=tipo==='reembolso'?'Reembolso':'Funcionário';
    const parcInfo=totalParc>0?` · ${ps.length}/${totalParc} parcelas`:'';
    const concluido=totalParc>0&&ps.length>=totalParc;

    h+=`<div class="lc" style="border-left:3px solid ${concluido?'#10b981':tipo==='reembolso'?'#3b82f6':'#f59e0b'}${concluido?' ;opacity:.7':''}"><div class="lh"><div><span class="tg" style="${tipoBg}">${tipoLabel}</span><strong>${esc(o.nome)}</strong>${concluido?'<span style="font-size:10px;color:#059669;margin-left:4px">✅ Quitado</span>':''}

    <button class="sm" onclick="delOb('${o.id}')">🗑️</button></div>`;

      const pct=Math.min(100,Math.round(ps.length/totalParc*100));
      h+=`<div style="margin-top:4px;background:#e2e8f0;border-radius:4px;height:6px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${concluido?'#10b981':'#3b82f6'};border-radius:4px;transition:width .3s"></div></div>`;
    }
    if(ps.length){h+=`<div style="margin-top:6px;border-top:1px solid #f1f5f9;padding-top:4px"><div style="font-size:10px;font-weight:700;color:#059669;margin-bottom:3px">✅ ${ps.length} meses provisionados</div>`;
      ps.forEach(p=>{
        const temReal=p.valorReal!=null&&p.valorReal!==undefined;
        const diff=temReal?p.valor-p.valorReal:0;
        h+=`<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:2px 0;color:#475569;flex-wrap:wrap"><span>${p.periodo}</span>
        <span style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
        <span style="color:#059669;font-weight:600">${fmt(p.valor)}</span>`;
        if(temReal){h+=`<span style="font-size:10px;color:#1d4ed8">real: ${fmt(p.valorReal)}</span>`;if(diff>0)h+=`<span style="font-size:9px;background:#dbeafe;color:#1d4ed8;padding:1px 4px;border-radius:3px">↩ ${fmt(diff)}</span>`;}
        h+=`<span style="color:#94a3b8">${esc(p.ref)}</span>
        <button class="sm" style="font-size:11px" title="Informar gasto real" onclick="editProvReal('${p.id}')">💲</button>
        <button class="sm" style="font-size:11px" onclick="delProv('${p.id}')">✕</button></span></div>`;
      });h+=`</div>`;}
    h+=`</div>`;});
  if(DB.obrigacoes.length)h+=`<button class="pri" style="margin-top:12px" onclick="novaProv()">+ Lançar provisão</button>`;
  el.innerHTML=h;
}
window.novaOb=function(){document.getElementById('tab-fixos').innerHTML=`<div class="fc"><h3 style="margin:0 0 10px;font-size:14px;font-weight:700">Nova obrigação</h3>

<div class="acts"><button class="can" onclick="renderFixos()">Cancelar</button><button class="pri" onclick="salvarOb()">Salvar</button></div></div>`;};
window.salvarOb=async function(){const o={id:uid(),nome:document.getElementById('of-n').value,valor:parseBRL(document.getElementById('of-v').value),dataInicio:document.getElementById('of-d').value,ativo:true,desc:document.getElementById('of-ds').value,tipo:document.getElementById('of-t').value,totalParcelas:parseInt(document.getElementById('of-pc').value)||0};if(!o.nome||!o.dataInicio||o.valor<=0)return alert('Preencha');DB.obrigacoes.push(o);await saveDB();};
window.delOb=async function(id){if(confirm('Excluir?')){DB.obrigacoes=DB.obrigacoes.filter(x=>x.id!==id);await saveDB();}};
window.delProv=async function(id){if(confirm('Excluir esta provisão?')){DB.provisoes=DB.provisoes.filter(x=>x.id!==id);await saveDB();}};
window.editProvReal=function(id){
  const p=DB.provisoes.find(x=>x.id===id);if(!p)return;
  const ob=DB.obrigacoes.find(o=>o.id===p.obrigacaoId);
  document.getElementById('modal-container').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:380px">
  <h3 style="font-size:14px;font-weight:700;margin-bottom:8px">💲 Gasto real — ${esc(ob?ob.nome:'')}</h3>
  <div style="font-size:11px;color:#64748b;margin-bottom:8px">${p.periodo}<br>Ref: ${esc(p.ref)} · Previsão: ${fmt(p.valor)}</div>
  <label class="lb">Valor realmente gasto</label>
  <input class="inp" id="pr-vr" value="${p.valorReal!=null?p.valorReal.toFixed(2).replace('.',','):''}">
  <div id="pr-diff" style="margin-top:6px;font-size:12px"></div>
  <div class="acts" style="margin-top:10px"><button class="can" onclick="closeModal()">Cancelar</button>${p.valorReal!=null?`<button class="dan" onclick="clearProvReal('${id}')">Limpar</button>`:''}<button class="pri" onclick="saveProvReal('${id}')">Salvar</button></div>
  </div></div>`;
  const inp=document.getElementById('pr-vr');
  inp.oninput=()=>{const v=parseBRL(inp.value);const d=p.valor-v;document.getElementById('pr-diff').innerHTML=d>0?`<span style="color:#1d4ed8;font-weight:600">↩ ${fmt(d)} volta ao pool</span>`:d<0?`<span style="color:#dc2626;font-weight:600">⚠️ ${fmt(Math.abs(d))} acima da previsão</span>`:`<span style="color:#059669">= Igual à previsão</span>`;};
  inp.oninput();
};
window.saveProvReal=async function(id){DB.provisoes=DB.provisoes.map(p=>p.id===id?{...p,valorReal:parseBRL(document.getElementById('pr-vr').value)}:p);await saveDB();closeModal();};
window.clearProvReal=async function(id){DB.provisoes=DB.provisoes.map(p=>{if(p.id===id){const np={...p};delete np.valorReal;return np;}return p;});await saveDB();closeModal();};
window.novaProv=function(){document.getElementById('tab-fixos').innerHTML=`<div class="fc"><h3 style="margin:0 0 10px;font-size:14px;font-weight:700">Lançar provisão</h3><label class="lb">Obrigação</label><select class="sel" id="pf-o" onchange="upPP()"><option value="">Selecione</option>${DB.obrigacoes.filter(o=>{const tp=o.totalParcelas||0;if(tp<=0)return true;return DB.provisoes.filter(p=>p.obrigacaoId===o.id).length<tp;}).map(o=>`<option value="${o.id}">${esc(o.nome)} ${o.tipo==='reembolso'?'💳':'👷'}</option>`).join('')}</select><div id="pf-f"></div>
<div class="acts"><button class="can" onclick="renderFixos()">Cancelar</button><button class="pri" onclick="salvarPr()">Salvar</button></div></div>`;};
window.upPP=function(){const ob=DB.obrigacoes.find(o=>o.id===document.getElementById('pf-o').value);if(!ob)return;
  const totalParc=ob.totalParcelas||0;
  const endDate=totalParc>0?(()=>{const d=new Date(ob.dataInicio+'T12:00:00');d.setMonth(d.getMonth()+totalParc);return d.toISOString().slice(0,10);})():'2027-12-31';
  const ps=getPeriodos(ob.dataInicio,endDate);
  const provCount=DB.provisoes.filter(pv=>pv.obrigacaoId===ob.id).length;
  let h=`<label class="lb">Período${totalParc>0?` (${provCount}/${totalParc})`:''}</label><select class="sel" id="pf-p"><option value="">—</option>`;
  ps.forEach(p=>{const c=DB.provisoes.some(pv=>pv.obrigacaoId===ob.id&&pv.periodoInicio===p.inicio);h+=`<option value="${p.inicio}"${c?' disabled':''}>${p.label}${c?' ✓':''}</option>`;});
  h+=`</select><label class="lb">Ref (medição)</label><input class="inp" id="pf-r" placeholder="Ex: Mananciais Junho"><label class="lb">Valor</label><input class="inp" id="pf-v" value="${ob.valor.toFixed(2).replace('.',',')}">`;document.getElementById('pf-f').innerHTML=h;};
window.salvarPr=async function(){const obId=document.getElementById('pf-o').value;const per=document.getElementById('pf-p')?.value;if(!obId||!per)return alert('Selecione');const ob=DB.obrigacoes.find(o=>o.id===obId);
  const totalParc=ob.totalParcelas||0;const endDate=totalParc>0?(()=>{const d=new Date(ob.dataInicio+'T12:00:00');d.setMonth(d.getMonth()+totalParc);return d.toISOString().slice(0,10);})():'2027-12-31';
  const ps=getPeriodos(ob.dataInicio,endDate);const p=ps.find(x=>x.inicio===per);
  if(totalParc>0&&DB.provisoes.filter(pv=>pv.obrigacaoId===obId).length>=totalParc)return alert('Todas as parcelas já foram provisionadas');
  DB.provisoes.push({id:uid(),obrigacaoId:obId,periodoInicio:per,periodo:p?.label||'',valor:parseBRL(document.getElementById('pf-v').value),ref:document.getElementById('pf-r').value||'Manual',dt:new Date().toISOString()});await saveDB();};

// ═══════ CONFIG ═══════
function renderConfig(){
  const el=document.getElementById('tab-config');
  let h=`<h2 class="st" style="margin-bottom:12px">Configurações</h2>
  <div class="g2">
  <div class="cd" style="border-left:4px solid #f59e0b"><div style="display:flex;justify-content:space-between;align-items:center">
  <div><div class="kl">⛽ Preço do litro</div>${DB.precoLitro>0?`<div style="font-size:18px;font-weight:800;margin-top:2px">${fmt(DB.precoLitro)}</div>`:`<div style="font-size:12px;color:#b45309">—</div>`}</div>
  <button class="warn-btn" onclick="editPreco()">✏️</button></div><div id="pf-pc"></div></div>
  <div class="cd" style="border-left:4px solid #8b5cf6"><div style="display:flex;justify-content:space-between;align-items:center">
  <div><div class="kl">🚗 Ajuda custo veículo</div><div style="font-size:18px;font-weight:800;margin-top:2px">${fmt(DB.ajudaCustoVeiculo)}</div><div style="font-size:9px;color:#7c3aed">Ronaldo → Tatiana/mês</div></div>
  <button class="warn-btn" style="background:#8b5cf6" onclick="editAjuda()">✏️</button></div><div id="pf-aj"></div></div></div>
  <div class="sh"><h3 style="font-size:15px;font-weight:800">Veículos</h3><button class="pri" onclick="novoVc()">+ Novo</button></div>`;
  DB.veiculos.forEach(v=>{h+=`<div class="lc"><div class="lh"><strong>🚗 ${esc(v.nome)}</strong><button class="sm" onclick="delVc('${v.id}')">🗑️</button></div>
  <span style="background:#dbeafe;color:#1d4ed8;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700">${v.kml} km/l</span></div>`;});
  if(!DB.veiculos.length)h+=`<div class="emp">Nenhum veículo.</div>`;
  h+=`<div style="margin-top:24px;border-top:1px solid #e2e8f0;padding-top:14px"><button class="dan" style="width:100%" onclick="resetAll()">Resetar e reimportar da planilha</button></div>`;
  el.innerHTML=h;
}
window.editPreco=function(){document.getElementById('pf-pc').innerHTML=`<div style="margin-top:8px;display:flex;gap:6px;align-items:flex-end"><div style="flex:1"><label class="lb">R$/litro</label><input class="inp" id="cp-v" value="${DB.precoLitro?DB.precoLitro.toFixed(2).replace('.',','):''}"></div><button class="sec" onclick="savePrc()">Salvar</button></div>`;};
window.savePrc=async function(){DB.precoLitro=parseBRL(document.getElementById('cp-v').value);await saveDB();};
window.editAjuda=function(){document.getElementById('pf-aj').innerHTML=`<div style="margin-top:8px;display:flex;gap:6px;align-items:flex-end"><div style="flex:1"><label class="lb">R$/mês</label><input class="inp" id="ca-v" value="${DB.ajudaCustoVeiculo?DB.ajudaCustoVeiculo.toFixed(2).replace('.',','):''}"></div><button class="sec" onclick="saveAj()">Salvar</button></div>`;};
window.saveAj=async function(){DB.ajudaCustoVeiculo=parseBRL(document.getElementById('ca-v').value);await saveDB();};
window.novoVc=function(){const el=document.getElementById('tab-config');const d=document.createElement('div');d.className='fc';d.innerHTML=`<label class="lb">Nome</label><input class="inp" id="vf-n"><label class="lb">Placa</label><input class="inp" id="vf-p"><label class="lb">km/l</label><input class="inp" type="number" id="vf-k" step="0.1">
<div class="acts"><button class="can" onclick="renderConfig()">Cancelar</button><button class="pri" onclick="saveVc()">Salvar</button></div>`;el.prepend(d);};
window.saveVc=async function(){const v={id:uid(),nome:document.getElementById('vf-n').value,placa:document.getElementById('vf-p').value,kml:parseFloat(document.getElementById('vf-k').value)||0};if(!v.nome||v.kml<=0)return alert('Preencha');DB.veiculos.push(v);await saveDB();};
window.delVc=async function(id){if(confirm('Excluir?')){DB.veiculos=DB.veiculos.filter(x=>x.id!==id);await saveDB();}};
window.resetAll=async function(){if(confirm('Resetar TUDO?')){DB={medicoes:[],saidas:[],obrigacoes:[],provisoes:[],veiculos:[],faturamento:[],precoLitro:0};await saveDB();await importInitial();}};
</script>
</body>
</html>
