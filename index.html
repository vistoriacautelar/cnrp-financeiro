window.previewImport=async function(input){
  const file=input.files[0];if(!file)return;
  // Load SheetJS
  if(!window.XLSX){
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    document.head.appendChild(s);
    await new Promise(r=>{s.onload=r;setTimeout(r,5000);});
  }
  try{
    const ab=await file.arrayBuffer();
    const wb=XLSX.read(ab,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

    // Parse structure
    let mesRef='',periodo='',items=[];
    for(let i=0;i<data.length;i++){
      const row=data[i];
      // Find PERÍODO
      if(String(row[0]).includes('PERÍODO')){periodo=String(row[1]||'').trim();}
      // Find MEDIÇÃO header
      for(let j=0;j<row.length;j++){const cell=String(row[j]||'');if(cell.match(/MEDI[ÇC][ÃA]O\s+/i)){mesRef=cell.replace(/MEDI[ÇC][ÃA]O\s*/i,'').trim();}}
      // Find data rows (numeric ITEM column + text frente + numbers)
      const item=parseFloat(row[0]);
      if(item>0&&!isNaN(item)&&row[1]&&String(row[1]).trim()&&String(row[0])!=='TOTAL'){
        const frente=String(row[1]).trim();
        const preco=parseFloat(row[2])||0;
        const qtd=parseFloat(row[3])||0;
        const valor=parseFloat(row[4])||0;
        if(qtd>0)items.push({frente,preco,qtd,valor});
      }
      // TOTAL row
      if(String(row[0]).toUpperCase()==='TOTAL'){
        // Could extract totals but we compute from items
      }
    }

    // Normalize mesRef: "JANEIRO" → "Janeiro 2026" etc
    const mesesNomes={JANEIRO:'Janeiro',FEVEREIRO:'Fevereiro',MARÇO:'Março',MARCO:'Março',ABRIL:'Abril',MAIO:'Maio',JUNHO:'Junho',JULHO:'Julho',AGOSTO:'Agosto',SETEMBRO:'Setembro',OUTUBRO:'Outubro',NOVEMBRO:'Novembro',DEZEMBRO:'Dezembro'};
    let mesNorm=mesRef;
    const mesUp=mesRef.toUpperCase().replace(/[^A-ZÇ]/g,'');
    if(mesesNomes[mesUp])mesNorm=mesesNomes[mesUp];
    // Try to get year from período
    const anoMatch=(periodo||'').match(/(20\d{2}|\d{2})\/?(\d{2})?$/);
    let ano='2026';
    if(anoMatch){ano=anoMatch[1].length===2?'20'+anoMatch[1]:anoMatch[1];}
    if(!mesRef.match(/\d{4}/))mesNorm+=' '+ano;

    const totalQtd=items.reduce((s,x)=>s+x.qtd,0);
    const totalVal=items.reduce((s,x)=>s+x.valor,0);

    window._impData={mesRef:mesNorm,items,totalQtd,totalVal};
    renderImpPreview();
    document.getElementById('imp-btn').disabled=false;
    document.getElementById('imp-drop').innerHTML=`<i class="fa-solid fa-check-circle" style="font-size:2rem;color:var(--success)"></i><p style="font-size:.9rem;color:var(--success);font-weight:600">${esc(file.name)}</p>`;
  }catch(e){console.error(e);document.getElementById('imp-preview').innerHTML=`<div style="color:var(--danger);font-size:.85rem;margin-top:8px"><i class="fa-solid fa-triangle-exclamation"></i> Erro ao ler arquivo: ${esc(e.message)}</div>`;}
};

window.renderImpPreview=function(){
    if(!window._impData)return;
    const {mesRef,items}=window._impData;
    const totalQtd=items.reduce((s,x)=>s+x.qtd,0);
    const totalVal=items.reduce((s,x)=>s+x.valor,0);
    window._impData.totalQtd=totalQtd;
    window._impData.totalVal=totalVal;

    const clienteId=document.getElementById('imp-cl').value;
    items.forEach(it=>{
      it._dup=DB.producao.some(p=>p.clienteId===clienteId&&p.mesRef===mesRef&&p.coletorNome.toLowerCase()===it.frente.toLowerCase());
      it._import=!it._dup;
    });
    const nDups=items.filter(x=>x._dup).length;

    let prev=`<div class="report-section"><h3 style="font-weight:700;margin-bottom:8px"><i class="fa-solid fa-eye"></i> Pré-visualização</h3>
    <div style="display:flex;gap:12px;align-items:flex-end;margin-bottom:12px"><div style="flex:0 0 200px"><label class="lb">Mês / Ano</label><input class="inp" id="imp-mesref" value="${esc(mesRef)}" onchange="window._impData.mesRef=this.value;renderImpPreview()"></div>
    <p style="font-size:.85rem;color:var(--text-muted)">${items.length} frentes · ${totalQtd} vistorias · ${fmt(totalVal)}</p></div>`;

    prev+=`<table style="width:100%;border-collapse:collapse;font-size:.85rem">
    <tr style="background:#f1f5f9"><th style="padding:8px;text-align:center;width:36px">✓</th><th style="padding:8px;text-align:left">Frente de serviço</th><th style="padding:8px;text-align:left">Tipo</th><th style="padding:8px;text-align:right">Preço</th><th style="padding:8px;text-align:right">Qtd</th><th style="padding:8px;text-align:right">Valor</th></tr>`;
    // Auto-detect tipo by matching unit price against valoresRelatorio
    const defaultTipo=document.getElementById('imp-tipo')?.value||'Simples';
    items.forEach((it,i)=>{
      if(!it._tipo){
        // Try to match price to a tipo for this client
        const match=DB.valoresRelatorio.find(v=>v.clienteId===clienteId&&Math.abs(v.valorUnitario-it.preco)<0.01);
        it._tipo=match?match.tipoRelatorio:defaultTipo;
      }
      prev+=`<tr style="background:${i%2?'#f8fafc':'#fff'}"><td style="padding:6px 8px;text-align:center"><input type="checkbox" class="imp-chk" data-idx="${i}"${it._import?' checked':''}></td>
      <td style="padding:4px 6px"><input class="inp" data-idx="${i}" value="${esc(it.frente)}" style="padding:4px 8px;font-size:.85rem" onchange="window._impData.items[${i}].frente=this.value;renderImpPreview()"></td>
      <td style="padding:4px 6px"><select class="sel imp-ed-tipo" data-idx="${i}" style="padding:4px 6px;font-size:.8rem" onchange="window._impData.items[${i}]._tipo=this.value">${TIPOS_REL.map(t=>`<option${it._tipo===t?' selected':''}>${t}</option>`).join('')}</select></td>
      <td style="padding:4px 6px"><input class="inp" value="${it.preco}" style="padding:4px 8px;font-size:.85rem;text-align:right;width:70px" onchange="window._impData.items[${i}].preco=parseFloat(this.value)||0;window._impData.items[${i}].valor=window._impData.items[${i}].preco*window._impData.items[${i}].qtd;renderImpPreview()"></td>
      <td style="padding:4px 6px"><input class="inp" value="${it.qtd}" type="number" style="padding:4px 8px;font-size:.85rem;text-align:right;width:55px" onchange="window._impData.items[${i}].qtd=parseInt(this.value)||0;window._impData.items[${i}].valor=window._impData.items[${i}].preco*window._impData.items[${i}].qtd;renderImpPreview()"></td>
      <td style="padding:6px 8px;text-align:right;font-weight:600">${fmt(it.valor)}</td></tr>`;
    });
    prev+=`<tr style="background:#e2e8f0;font-weight:700"><td style="padding:8px"></td><td colspan="3" style="padding:8px">TOTAL</td><td style="padding:8px;text-align:right">${totalQtd}</td><td style="padding:8px;text-align:right">${fmt(totalVal)}</td><td></td></tr></table>`;

    const fatDup=DB.faturamento.some(f=>(f.clienteNorm||f.cliente)===document.getElementById('imp-cl').selectedOptions[0]?.textContent&&f.mesRef===mesRef);
    prev+=`<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.875rem;cursor:pointer"><input type="checkbox" id="imp-fat"${fatDup?'':' checked'}> Criar registro de faturamento (${fmt(totalVal)})${fatDup?' <span style="color:var(--warning);font-weight:600">⚠️ já existe faturamento para este cliente/mês</span>':''}</label>`;
    prev+=`</div>`;
    document.getElementById('imp-preview').innerHTML=prev;
};

window.confirmarImport=async function(){
  if(!window._impData)return alert('Nenhum dado para importar');
  const clienteId=document.getElementById('imp-cl').value;
  const clienteNome=document.getElementById('imp-cl').selectedOptions[0]?.textContent||'';
  const tipo=document.getElementById('imp-tipo').value;
  if(!clienteId)return alert('Selecione o cliente');

  const mesRef=window._impData.mesRef;const items=window._impData.items;const totalQtd=window._impData.totalQtd;const totalVal=window._impData.totalVal;
  const criarFat=document.getElementById('imp-fat')?.checked;

  // Read which items are checked
  const checkedIdxs=new Set();
  document.querySelectorAll('.imp-chk:checked').forEach(chk=>checkedIdxs.add(parseInt(chk.dataset.idx)));
  const toImport=items.filter((_,i)=>checkedIdxs.has(i));

  if(!toImport.length)return alert('Nenhum item selecionado para importar');

  let importedQtd=0;
  toImport.forEach(it=>{
    const itemTipo=it._tipo||tipo;
    const col=vcColetores.find(c=>c.clienteId===clienteId&&c.nome.toLowerCase()===it.frente.toLowerCase());
    DB.producao.push({
      id:uid(),mesRef,tipoRelatorio:itemTipo,clienteId,clienteNome,
      coletorId:col?col.id:'',coletorNome:it.frente,
      quantidade:it.qtd,valorUnitario:it.preco
    });
    importedQtd+=it.qtd;
  });

  if(criarFat){
    const fatVal=toImport.reduce((s,x)=>s+x.valor,0);
    DB.faturamento.push({id:uid(),cliente:clienteNome,clienteNorm:clienteNome,mesRef,valorTotal:fatVal,nf:'',envioMedicao:'',emissaoNF:'',prevPagamento:'',dataDeposito:'',status:'Pendente',obs:'',imposto:0,arquivos:[]});
  }

  await saveDB('Importação planilha',mesRef+' '+clienteNome+' '+toImport.length+' frentes '+importedQtd+' vistorias');
  window._impData=null;
  alert('Importado: '+toImport.length+' frentes, '+importedQtd+' vistorias'+(criarFat?' + faturamento':''));
  renderProducao();
};


// ═══════ MULTI-DELETE ═══════
window.updDelBtn=function(type){
  const chks=document.querySelectorAll('.chk-'+type+':checked');
  const btn=document.getElementById('btn-del-'+type);
  if(btn)btn.style.display=chks.length>0?'inline-flex':'none';
  if(btn&&chks.length>0)btn.innerHTML=`<i class="fa-solid fa-trash"></i> Excluir ${chks.length} selecionado(s)`;
};
window.delSelectedSaidas=async function(){
  const ids=[...document.querySelectorAll('.chk-saida:checked')].map(x=>x.value);
  if(!ids.length)return;
  if(!confirm(`Excluir ${ids.length} saída(s)?`))return;
  DB.saidas=DB.saidas.filter(x=>!ids.includes(x.id));
  await saveDB('Saídas excluídas (lote)',ids.length+' itens');renderSaidas();
};
window.delSelectedProd=async function(){
  const ids=[...document.querySelectorAll('.chk-prod:checked')].map(x=>x.value);
  if(!ids.length)return;
  if(!confirm(`Excluir ${ids.length} registro(s) de produção?`))return;
  DB.producao=DB.producao.filter(x=>!ids.includes(x.id));
  await saveDB('Produção excluída (lote)',ids.length+' itens');renderProducao();
};

// ═══════ CONFIG ═══════
function renderConfig(){
  const el=document.getElementById('tab-config');
  document.getElementById('top-metrics').innerHTML='';
  let h=`<div class="config-grid">
  <div class="config-card orange-border"><div class="c-info"><h4><i class="fa-solid fa-gas-pump"></i> Preço do litro</h4><div class="val">${DB.precoLitro>0?fmt(DB.precoLitro):'—'}</div></div><button class="btn-edit-circle" onclick="editPreco()"><i class="fa-solid fa-pen"></i></button></div>
  <div class="config-card"><div class="c-info"><h4><i class="fa-solid fa-car"></i> Ajuda custo veículo</h4><div class="val">${fmt(DB.ajudaCustoVeiculo)}</div><p>Ronaldo → Tatiana/mês</p></div><button class="btn-edit-circle" onclick="editAjuda()"><i class="fa-solid fa-pen"></i></button></div></div>
  <div id="pf-pc"></div><div id="pf-aj"></div>`;
  h+=`<div class="list-box"><div class="list-box-header"><h3 style="font-weight:700">Veículos</h3><button class="btn-primary" style="padding:8px 14px;font-size:.8rem" onclick="novoVc()"><i class="fa-solid fa-plus"></i> Novo</button></div>`;
  DB.veiculos.forEach(v=>{h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)"><div><strong>${esc(v.nome)}</strong> <span style="background:#dbeafe;color:var(--primary);padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600">${v.kml} km/l</span></div><i class="fa-solid fa-trash btn-icon-danger" onclick="delVc('${v.id}')"></i></div>`;});
  if(!DB.veiculos.length)h+=`<p style="color:var(--text-muted);font-size:.875rem;padding:12px 0">Nenhum veículo.</p>`;
  h+=`</div>`;
  h+=`<div class="list-box"><div class="list-box-header"><h3 style="font-weight:700"><i class="fa-solid fa-dollar-sign" style="color:var(--success)"></i> Valores por relatório</h3><button class="btn-primary" style="padding:8px 14px;font-size:.8rem" onclick="cfgEditValores()"><i class="fa-solid fa-pen"></i> Editar</button></div>
  <p style="font-size:.8rem;color:var(--text-muted);margin-bottom:12px">Preço unitário de cada tipo de relatório por cliente.</p>`;
  const cfgClientes=vcClientes.length?vcClientes:CLIENTES.map(c=>({id:c,nome:c}));
  cfgClientes.forEach(cl=>{const vals=DB.valoresRelatorio.filter(v=>v.clienteId===cl.id);if(!vals.length)return;
    h+=`<div style="margin-bottom:10px"><strong style="font-size:.875rem">${esc(cl.nome)}</strong><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${vals.map(v=>`<span style="font-size:.8rem;background:var(--success-bg);border:1px solid #bbf7d0;padding:3px 10px;border-radius:6px;color:var(--success-text)">${esc(v.tipoRelatorio)}: <strong>${fmt(v.valorUnitario)}</strong></span>`).join('')}</div></div>`;
  });
  h+=`</div>`;
  h+=`<button class="btn-secondary" style="width:100%;justify-content:center;margin-top:16px;color:var(--danger);border-color:#fecaca" onclick="resetAll()"><i class="fa-solid fa-rotate"></i> Resetar e reimportar</button>`;
  el.innerHTML=h;
}
window.cfgEditValores=function(){
  const el=document.getElementById('tab-config');
  const cfgClientes=vcClientes.length?vcClientes:CLIENTES.map(c=>({id:c,nome:c}));
  let h=`<div class="fc"><h3 style="margin:0 0 12px;font-size:16px;font-weight:700">💲 Valores por relatório</h3>
  <p style="font-size:12px;color:#64748b;margin-bottom:14px">Defina o valor unitário de cada tipo de relatório para cada cliente.</p>
  <table style="width:100%;border-collapse:collapse;font-size:13px">
  <tr style="background:#f1f5f9"><th style="padding:8px;text-align:left">Cliente</th>${TIPOS_REL.map(t=>`<th style="padding:8px;text-align:center">${t}</th>`).join('')}</tr>`;
  cfgClientes.forEach((cl,i)=>{
    h+=`<tr style="background:${i%2?'#f8fafc':'#fff'}"><td style="padding:6px 8px;font-weight:600">${esc(cl.nome)}</td>`;
    TIPOS_REL.forEach(tipo=>{
      const ex=DB.valoresRelatorio.find(v=>v.clienteId===cl.id&&v.tipoRelatorio===tipo);
      h+=`<td style="padding:4px 6px"><input class="inp cfg-vr" data-cl="${cl.id}" data-clnome="${esc(cl.nome)}" data-tipo="${tipo}" value="${ex?ex.valorUnitario.toFixed(2).replace('.',','):''}" placeholder="0,00" style="text-align:center;padding:6px"></td>`;
    });
    h+=`</tr>`;
  });
  h+=`</table><div class="acts"><button class="btn-secondary" onclick="renderConfig()">Cancelar</button><button class="btn-primary" onclick="salvarCfgValores()">Salvar todos</button></div></div>`;
  el.innerHTML=h;
};
window.salvarCfgValores=async function(){
  document.querySelectorAll('.cfg-vr').forEach(inp=>{
    const clId=inp.dataset.cl,clNome=inp.dataset.clnome,tipo=inp.dataset.tipo;
    const val=parseBRL(inp.value);
    const idx=DB.valoresRelatorio.findIndex(v=>v.clienteId===clId&&v.tipoRelatorio===tipo);
    if(val>0){if(idx>=0)DB.valoresRelatorio[idx].valorUnitario=val;else DB.valoresRelatorio.push({clienteId:clId,clienteNome:clNome,tipoRelatorio:tipo,valorUnitario:val});}
    else if(idx>=0){DB.valoresRelatorio.splice(idx,1);}
  });
  await saveDB();
};
window.editPreco=function(){document.getElementById('pf-pc').innerHTML=`<div style="margin-top:8px;display:flex;gap:6px;align-items:flex-end"><div style="flex:1"><label class="lb">R$/litro</label><input class="inp" id="cp-v" value="${DB.precoLitro?DB.precoLitro.toFixed(2).replace('.',','):''}"></div><button class="btn-secondary" onclick="savePrc()">Salvar</button></div>`;};
window.savePrc=async function(){DB.precoLitro=parseBRL(document.getElementById('cp-v').value);await saveDB('Preço litro alterado','');renderConfig();};
window.editAjuda=function(){document.getElementById('pf-aj').innerHTML=`<div style="margin-top:8px;display:flex;gap:6px;align-items:flex-end"><div style="flex:1"><label class="lb">R$/mês</label><input class="inp" id="ca-v" value="${DB.ajudaCustoVeiculo?DB.ajudaCustoVeiculo.toFixed(2).replace('.',','):''}"></div><button class="btn-secondary" onclick="saveAj()">Salvar</button></div>`;};
window.saveAj=async function(){DB.ajudaCustoVeiculo=parseBRL(document.getElementById('ca-v').value);await saveDB('Ajuda custo alterada','');renderConfig();};
window.novoVc=function(){const el=document.getElementById('tab-config');const d=document.createElement('div');d.className='fc';d.innerHTML=`<label class="lb">Nome</label><input class="inp" id="vf-n"><label class="lb">Placa</label><input class="inp" id="vf-p"><label class="lb">km/l</label><input class="inp" type="number" id="vf-k" step="0.1">
<div class="acts"><button class="btn-secondary" onclick="renderConfig()">Cancelar</button><button class="btn-primary" onclick="saveVc()">Salvar</button></div>`;el.prepend(d);};
window.saveVc=async function(){const v={id:uid(),nome:document.getElementById('vf-n').value,placa:document.getElementById('vf-p').value,kml:parseFloat(document.getElementById('vf-k').value)||0};if(!v.nome||v.kml<=0)return alert('Preencha');DB.veiculos.push(v);await saveDB('Veículo adicionado',v.nome);renderConfig();};
window.delVc=async function(id){if(confirm('Excluir?')){DB.veiculos=DB.veiculos.filter(x=>x.id!==id);await saveDB('Veículo excluído','');renderConfig();}};
function renderLogs(){
  const el=document.getElementById('tab-logs');
  document.getElementById('top-metrics').innerHTML='';
  const logs=[...DB.logs].sort((a,b)=>(b.dt||'').localeCompare(a.dt||''));
  let h=`<div class="report-section"><h3 style="font-weight:700;margin-bottom:16px"><i class="fa-solid fa-clock-rotate-left"></i> Registro de atividades (${logs.length})</h3>`;
  if(logs.length){
    h+=`<table style="width:100%;border-collapse:collapse;font-size:.85rem">
    <tr style="background:#f1f5f9"><th style="padding:10px;text-align:left">Data/Hora</th><th style="padding:10px;text-align:left">Usuário</th><th style="padding:10px;text-align:left">Ação</th><th style="padding:10px;text-align:left">Detalhe</th></tr>`;
    logs.slice(0,100).forEach((l,i)=>{
      const dt=l.dt?new Date(l.dt).toLocaleString('pt-BR'):'—';
      h+=`<tr style="background:${i%2?'#f8fafc':'#fff'}"><td style="padding:8px 10px;white-space:nowrap">${dt}</td><td style="padding:8px 10px;font-weight:500">${esc(l.usuario||'')}</td><td style="padding:8px 10px"><span style="background:#eff6ff;color:var(--primary);padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600">${esc(l.acao||'')}</span></td><td style="padding:8px 10px;color:var(--text-muted)">${esc(l.detalhe||'')}</td></tr>`;
    });
    h+=`</table>`;
    if(logs.length>100)h+=`<p style="font-size:.8rem;color:var(--text-muted);margin-top:8px">Mostrando últimos 100 de ${logs.length} registros.</p>`;
  }else{h+=`<div class="empty-state"><i class="fa-solid fa-clock-rotate-left"></i><p>Nenhum registro ainda.</p></div>`;}
  h+=`</div>`;
  el.innerHTML=h;
}

window.resetAll=async function(){if(confirm('Resetar TUDO?')){DB={medicoes:[],saidas:[],obrigacoes:[],provisoes:[],veiculos:[],faturamento:[],precoLitro:0};await saveDB();await importInitial();}};
</script>
