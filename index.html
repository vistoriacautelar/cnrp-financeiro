<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vistoria Cautelar Financeiro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --sidebar-bg: #0f172a;
            --sidebar-hover: #1e293b;
            --bg-app: #f1f5f9;
            --white: #ffffff;
            --text-dark: #0f172a;
            --text-base: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            
            --success: #10b981;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            
            --warning: #f59e0b;
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-app); color: var(--text-base); min-height: 100vh; margin: 0; }
        body.app-loaded { display: flex; height: 100vh; overflow: hidden; }

        /* SCROLLBAR CUSTOMIZATION */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* SIDEBAR */
        .sidebar { width: 280px; background-color: var(--sidebar-bg); color: var(--white); display: flex; flex-direction: column; flex-shrink: 0; }
        .brand { padding: 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .brand-icon { background: var(--primary); width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .brand-text h2 { font-size: 1rem; font-weight: 700; letter-spacing: 0.5px; }
        .brand-text span { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .nav-menu { padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #cbd5e1; text-decoration: none; border-radius: 8px; font-size: 0.9375rem; font-weight: 500; transition: all 0.2s; cursor: pointer; }
        .nav-item i { width: 20px; text-align: center; font-size: 1.125rem; }
        .nav-item:hover { background-color: var(--sidebar-hover); color: var(--white); }
        .nav-item.active { background-color: var(--primary); color: var(--white); }
        .nav-badge { margin-left: auto; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; }
        .nav-item.active .nav-badge { background: rgba(0,0,0,0.2); }
        .sidebar-footer { padding: 24px; border-top: 1px solid rgba(255,255,255,0.1); }
        .sync-status { display: flex; align-items: center; gap: 8px; color: #34d399; font-size: 0.8125rem; font-weight: 600; background: rgba(16, 185, 129, 0.1); padding: 10px 16px; border-radius: 8px; }

        /* MAIN CONTENT AREA */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .top-header { background: var(--white); padding: 20px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); }
        
        .header-actions { display: flex; gap: 16px; align-items: center; }
        .btn-primary { background-color: var(--primary); color: var(--white); border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.9375rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--white); color: var(--text-base); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; font-size: 0.9375rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-secondary:hover { background-color: #f8fafc; border-color: #cbd5e1; }

        .content-area { padding: 40px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .section-title { margin-bottom: 24px; color: var(--text-muted); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        /* TAB SYSTEM */
        .tab-pane { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           TAB: PAINEL
           ========================================= */
        .alert-group { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 24px; box-shadow: var(--shadow-sm); overflow: hidden; }
        .alert-header { padding: 16px 24px; font-weight: 600; font-size: 0.9375rem; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
        .alert-header.danger { background: var(--danger-bg); color: var(--danger-text); }
        .alert-header.warning { background: var(--warning-bg); color: var(--warning-text); }
        
        .alert-list { display: none; flex-direction: column; }
        .alert-list.open { display: flex; }
        .alert-item { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .alert-item:last-child { border-bottom: none; }
        .alert-item:hover { background: #f8fafc; }
        .alert-info h4 { font-size: 0.9375rem; color: var(--text-dark); margin-bottom: 4px; }
        .alert-info p { font-size: 0.8125rem; color: var(--text-muted); }
        .alert-value { font-size: 1.125rem; font-weight: 700; color: var(--text-dark); text-align: right; margin-right: 16px;}
        
        .summary-cards-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 32px; }
        .summary-card { background: var(--white); padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .summary-card h3 { font-size: 0.875rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-weight: 600;}
        .summary-card .value { font-size: 1.75rem; font-weight: 700; }
        .summary-card.blue .value { color: var(--primary); }
        .summary-card.green .value { color: var(--success); }
        .summary-card.orange .value { color: var(--warning); }

        /* =========================================
           TAB: SAÍDAS & COMUM LISTS
           ========================================= */
        .filters-row { display: flex; gap: 16px; margin-bottom: 24px; }
        .filter-input { padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.9375rem; outline: none; min-width: 200px;}
        .filter-input:focus { border-color: var(--primary); }
        
        .total-banner { background: var(--white); padding: 20px 24px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .total-banner .lbl { font-size: 0.875rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .total-banner .val { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); }
        
        .data-list { display: flex; flex-direction: column; gap: 12px; }
        .data-row { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; transition: box-shadow 0.2s; border-left: 4px solid var(--primary); }
        .data-row:hover { box-shadow: var(--shadow-md); }
        .data-col-main { display: flex; flex-direction: column; gap: 8px; }
        .data-row-title { display: flex; gap: 12px; align-items: center; font-size: 0.9375rem; font-weight: 600; color: var(--text-dark); }
        .tag-user { background: #fce7f3; color: #be185d; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
        .data-row-desc { display: flex; gap: 16px; font-size: 0.8125rem; color: var(--text-muted); align-items: center; }
        .data-row-desc i { margin-right: 4px; }
        .data-col-val { font-size: 1.125rem; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 16px;}
        .btn-icon-danger { color: #cbd5e1; cursor: pointer; transition: color 0.2s; }
        .btn-icon-danger:hover { color: var(--danger); }

        /* =========================================
           TAB: PREVISÕES
           ========================================= */
        .prev-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
        .prev-header { display: flex; justify-content: space-between; margin-bottom: 16px; align-items: flex-start; }
        .prev-title { display: flex; gap: 12px; align-items: center; }
        .tag-prev { background: #fef08a; color: #854d0e; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .tag-desc { background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .prev-title h3 { font-size: 1.125rem; font-weight: 700; color: var(--text-dark); }
        .prev-subtitle { font-size: 0.8125rem; color: var(--text-muted); margin-top: 4px; }
        
        .progress-bar-bg { background: #e2e8f0; height: 6px; border-radius: 3px; margin: 16px 0; overflow: hidden; }
        .progress-bar-fill { background: var(--primary); height: 100%; border-radius: 3px; }
        .progress-lbl { font-size: 0.8125rem; color: var(--success); font-weight: 600; display: flex; gap: 6px; align-items: center; }
        
        .prev-items { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; display: flex; flex-direction: column; gap: 8px;}
        .prev-item { display: flex; justify-content: space-between; font-size: 0.875rem; padding: 4px 0; }
        .prev-item .date { color: var(--text-muted); }
        .prev-item .val { font-weight: 600; color: var(--success); display: flex; align-items: center; gap: 12px; }
        
        /* =========================================
           TAB: RELATÓRIOS
           ========================================= */
        .report-section { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; }
        .bar-chart-row { margin-bottom: 16px; }
        .bar-chart-labels { display: flex; justify-content: space-between; font-size: 0.875rem; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .bar-chart-labels span:last-child { color: var(--text-muted); font-weight: 400; }
        .bar-track { background: #f1f5f9; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 4px; }
        .bar-fill { height: 100%; border-radius: 6px; }
        .bar-fill.blue { background: var(--primary); }
        .bar-fill.orange { background: var(--warning); }
        .bar-sub { font-size: 0.75rem; color: var(--text-muted); }

        /* =========================================
           TAB: CONFIGURAÇÕES
           ========================================= */
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
        .config-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #8b5cf6; }
        .config-card.orange-border { border-left-color: var(--warning); }
        .c-info h4 { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
        .c-info .val { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); }
        .c-info p { font-size: 0.75rem; color: #94a3b8; margin-top: 2px;}
        .btn-edit-circle { width: 36px; height: 36px; border-radius: 50%; background: #f1f5f9; color: var(--text-muted); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: all 0.2s;}
        .btn-edit-circle:hover { background: var(--primary); color: white; }

        .list-box { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; }
        .list-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }

        /* =========================================
           TAB: PRODUÇÃO (Empty State)
           ========================================= */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; color: #cbd5e1; margin-bottom: 16px; }
        .empty-state p { font-size: 0.9375rem; margin-bottom: 24px; }

    
/* APP-SPECIFIC OVERRIDES */

input:focus,select:focus,textarea:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none}
button{cursor:pointer;font-family:inherit}
.lb{display:block;font-size:.7rem;font-weight:600;color:var(--text-muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px}
.inp,.sel{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:.875rem;background:#fff;color:var(--text-dark)}
.row{display:flex;gap:12px;align-items:flex-end}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.fc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.cd{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm)}
.kl{font-size:.7rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.kv{font-size:1.25rem;font-weight:700;color:var(--text-dark);margin:4px 0}
.ks{font-size:.75rem;color:var(--text-muted)}
.emp{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:.875rem}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--radius-lg);padding:24px;max-width:720px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.nf-thumb{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer}
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh;padding:20px;width:100%}
.login-card{background:#fff;border-radius:16px;padding:40px 32px;box-shadow:0 4px 20px rgba(0,0,0,.1);max-width:380px;width:100%;text-align:center}
#app{display:none}
/* Accordion for faturamento */
details.client-group{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;box-shadow:var(--shadow-sm);overflow:hidden;transition:box-shadow .2s}
details.client-group:hover{box-shadow:var(--shadow-md)}
summary.client-header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;user-select:none}
summary.client-header::-webkit-details-marker{display:none}
.client-avatar{width:44px;height:44px;border-radius:10px;background:#eff6ff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:700;flex-shrink:0}
.client-info{display:flex;align-items:center;gap:16px}
.client-name{font-size:1rem;color:var(--text-dark);font-weight:600}
.client-sub{font-size:.8rem;color:var(--text-muted)}
.client-stats{display:flex;gap:8px;align-items:center}
.stat-badge{padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:600;display:flex;align-items:center;gap:6px}
.stat-badge.pendente{background:var(--warning-bg);color:var(--warning-text)}
.stat-badge.pago{background:var(--success-bg);color:var(--success-text)}
.stat-badge.zero{background:#f1f5f9;color:var(--text-muted)}
.chevron{color:var(--text-muted);transition:transform .3s}
details[open] .chevron{transform:rotate(180deg)}
.client-content{padding:20px;background:#f8fafc;border-top:1px solid var(--border)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.fat-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:var(--shadow-sm);position:relative;display:flex;flex-direction:column;gap:14px}
.fat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:10px 0 0 10px}
.fat-card.st-pend::before{background:var(--warning)}
.fat-card.st-pago::before{background:var(--success)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start}
.card-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.8rem;background:#f1f5f9;padding:10px;border-radius:var(--radius-md)}
.detail-item{display:flex;flex-direction:column}
.detail-item span{color:var(--text-muted);font-size:.65rem;text-transform:uppercase;font-weight:600}
.detail-item strong{color:var(--text-base)}
.card-actions{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px dashed var(--border)}
.attach-btn{font-size:.8rem;color:var(--primary);font-weight:500;display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer}
.status-tag{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:4px;display:inline-block}
.status-tag.pend{background:var(--warning-bg);color:var(--warning-text)}
.status-tag.pago{background:var(--success-bg);color:var(--success-text)}
.btn-icon{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:6px;border-radius:4px;transition:all .2s}
.btn-icon:hover{background:#f1f5f9;color:var(--text-dark)}
.btn-icon.check:hover{color:var(--success)}
.btn-icon.edit:hover{color:var(--primary)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #fecaca;padding:10px 20px;border-radius:var(--radius-md);font-size:.875rem;font-weight:500}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div style="font-size:40px;margin-bottom:8px">💰</div>
    <h1 style="font-size:20px;font-weight:800;margin-bottom:4px">Vistoria Cautelar Financeiro</h1>
    <p style="font-size:12px;color:#64748b;margin-bottom:20px">Controle de medições, despesas e faturamento</p>
    <input class="inp" id="login-email" type="email" placeholder="Email" style="margin-bottom:8px">
    <input class="inp" id="login-pass" type="password" placeholder="Senha" style="margin-bottom:12px">
    <button class="btn-primary" style="width:100%;justify-content:center;padding:12px" onclick="doLogin()">Entrar</button>
    <p id="login-err" style="color:var(--danger);font-size:12px;margin-top:8px;display:none"></p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;width:100%;height:100vh">
<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
    <div class="brand-text"><h2>Vistoria Cautelar</h2><span>Financeiro</span></div>
  </div>
  <nav class="nav-menu" id="nav"></nav>
  <div class="sidebar-footer">
    <div class="sync-status" id="sync-status"><i class="fa-solid fa-cloud"></i> Conectando...</div>
    <div id="user-info" style="color:#94a3b8;font-size:.75rem;margin-top:8px"></div><button style="background:none;border:none;color:#94a3b8;font-size:.8rem;margin-top:4px;cursor:pointer;width:100%;text-align:left" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
  </div>
</aside>
<main class="main-content">
  <header class="top-header">
    <h1 class="page-title" id="page-title">Painel</h1>
    <div class="header-actions" id="top-metrics"></div>
  </header>
  <div class="content-area">
    <div id="tab-painel" class="tab-pane active"></div>
    <div id="tab-fat" class="tab-pane"></div>
    <div id="tab-saidas" class="tab-pane"></div>
    <div id="tab-fixos" class="tab-pane"></div>
    <div id="tab-clientes" class="tab-pane"></div>
    <div id="tab-producao" class="tab-pane"></div>
    <div id="tab-relatorio" class="tab-pane"></div>
    <div id="tab-config" class="tab-pane"></div>
    <div id="tab-logs" class="tab-pane"></div>
  </div>
</main>
</div>
<div id="modal-container"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import{getFirestore,doc,setDoc,getDoc,onSnapshot,collection,getDocs,query,where,orderBy}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import{getStorage,ref as sRef,uploadBytes,getDownloadURL,listAll,deleteObject}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

let DB={medicoes:[],saidas:[],obrigacoes:[],provisoes:[],veiculos:[],faturamento:[],precoLitro:0,ajudaCustoVeiculo:1000,producao:[],valoresRelatorio:[],logs:[]};
const DOC_REF=doc(firestore,'financeiro','data');
let unsubSnap=null;

function addLog(acao,detalhe){
  if(!currentUserData)return;
  const log={id:uid(),usuario:currentUserData.nome||currentUserData.email,uid:currentUserData.uid,acao,detalhe:detalhe||'',dt:new Date().toISOString()};
  DB.logs.push(log);
  if(DB.logs.length>500)DB.logs=DB.logs.slice(-500); // keep last 500
}
async function saveDB(logAcao,logDetalhe){
  if(logAcao)addLog(logAcao,logDetalhe);
  _lastSaveTs=Date.now();
  try{await setDoc(DOC_REF,{...DB,updatedAt:new Date().toISOString(),updatedBy:currentUserData?.nome||currentUserData?.email||''},{merge:false});
  document.getElementById('sync-status').innerHTML='<i class="fa-solid fa-cloud-arrow-up"></i> Sincronizado';document.getElementById('sync-status').style.color='#34d399';
  }catch(e){console.error('Save error:',e);
  document.getElementById('sync-status').innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> Erro sync';document.getElementById('sync-status').style.color='#f87171';}
}

// ═══════ INTEGRAÇÃO VISTORIA CAUTELAR ═══════
let vcClientes=[],vcColetores=[];
async function loadVCData(){
  try{
    const[clSnap,colSnap]=await Promise.all([getDocs(collection(firestore,'clientes')),getDocs(collection(firestore,'coletores'))]);
    vcClientes=[];clSnap.forEach(d=>vcClientes.push({id:d.id,...d.data()}));vcClientes.sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
    vcColetores=[];colSnap.forEach(d=>vcColetores.push({id:d.id,...d.data()}));vcColetores.sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
    console.log('VC data loaded:',vcClientes.length,'clientes,',vcColetores.length,'coletores');
  }catch(e){console.error('loadVCData error:',e);}
}
const TIPOS_REL=['Simples','Completo','Sinistro','Nexo Causal'];

let _lastSaveTs=0;
function startSync(){
  unsubSnap=onSnapshot(DOC_REF,(snap)=>{
    if(snap.exists()){
      const d=snap.data();
      DB.medicoes=d.medicoes||[];DB.saidas=d.saidas||[];DB.obrigacoes=d.obrigacoes||[];
      DB.provisoes=d.provisoes||[];DB.veiculos=d.veiculos||[];DB.faturamento=d.faturamento||[];
      DB.precoLitro=d.precoLitro||0;DB.ajudaCustoVeiculo=d.ajudaCustoVeiculo??1000;DB.producao=d.producao||[];DB.valoresRelatorio=d.valoresRelatorio||[];DB.logs=d.logs||[];
      document.getElementById('sync-status').innerHTML='<i class="fa-solid fa-cloud-arrow-up"></i> Sincronizado';document.getElementById('sync-status').style.color='#34d399';
      // Skip render if this is our own write (within 3 seconds)
      if(Date.now()-_lastSaveTs<3000){/* own write, skip render */}else{render();}
    }else{importInitial();}
  },(err)=>{console.error('Snap error:',err);
    document.getElementById('sync-status').innerHTML='<i class="fa-solid fa-cloud-xmark"></i> Offline';});
}

window.doLogin=async function(){
  const email=document.getElementById('login-email').value;
  const pass=document.getElementById('login-pass').value;
  const errEl=document.getElementById('login-err');
  try{errEl.style.display='none';await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){errEl.textContent='Email ou senha incorretos';errEl.style.display='block';}
};
window.doLogout=function(){if(unsubSnap)unsubSnap();signOut(auth);};

let currentUserData=null;
onAuthStateChanged(auth,async(user)=>{
  if(user){
    // Try to check role, but don't block login if it fails
    currentUserData={uid:user.uid,email:user.email,nome:user.email};
    try{
      const userDoc=await getDoc(doc(firestore,'users',user.uid));
      if(userDoc.exists()){
        const ud=userDoc.data();
        currentUserData={uid:user.uid,email:user.email,nome:ud.nome||user.email,role:ud.role||'master',...ud};
        if(ud.role&&ud.role!=='master'){
          document.getElementById('login-err').textContent='Acesso restrito a usuários master.';
          document.getElementById('login-err').style.display='block';
          signOut(auth);return;
        }
      }
    }catch(e){console.warn('Role check failed (continuing as master):',e);}
    document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='flex';document.body.classList.add('app-loaded');document.getElementById('user-info').textContent=currentUserData?.nome||currentUserData?.email||'';startSync();loadVCData();
  }else{
    currentUserData=null;
    document.getElementById('login-screen').style.display='flex';document.getElementById('app').style.display='none';document.body.classList.remove('app-loaded');if(unsubSnap)unsubSnap();
  }
});

  <button class="btn-secondary" style="flex:1;justify-content:center;background:#3b82f6" onclick="closeModal();doUpload('${fatId}','Medição')"><i class="fa-solid fa-ruler-combined"></i> Medição</button>

  </div></div>`;
};

window.doUpload=async function(fatId,tipoDoc){
  const input=document.createElement('input');input.type='file';input.accept='image/*,application/pdf';
  input.onchange=async function(){
    const file=input.files[0];if(!file)return;
    const path=`financeiro/notas/${fatId}/${file.name}`;
    const storageRef=sRef(storage,path);
    try{
      document.getElementById('upload-status-'+fatId).textContent='Enviando...';
      await uploadBytes(storageRef,file);
      const url=await getDownloadURL(storageRef);
      DB.faturamento=DB.faturamento.map(f=>{
        if(f.id===fatId){const arquivos=f.arquivos||[];arquivos.push({nome:file.name,url,path,tipo:tipoDoc,dt:new Date().toISOString()});return{...f,arquivos};}
        return f;
      });
      await saveDB('Arquivo anexado',tipoDoc+' - '+file.name);
      document.getElementById('upload-status-'+fatId).textContent='✅ Enviado!';
      // Don't re-render — keep scroll position and accordion state
    }catch(e){console.error('Upload error:',e);document.getElementById('upload-status-'+fatId).textContent='❌ Erro: '+e.message;}
  };
  input.click();
};

window.delNF=async function(fatId,path,idx){
  if(!confirm('Excluir este arquivo?'))return;
  try{await deleteObject(sRef(storage,path));}catch(e){console.log('File may not exist:',e);}
  DB.faturamento=DB.faturamento.map(f=>{if(f.id===fatId){const a=[...(f.arquivos||[])];a.splice(idx,1);return{...f,arquivos:a};}return f;});
  await saveDB();
};

// ═══════ HELPERS ═══════
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=v=>(v==null||isNaN(v))?'R$ 0,00':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtD=d=>{if(!d||d==='NaT')return'—';try{return new Date(d+'T12:00').toLocaleDateString('pt-BR')}catch{return d}};
const parseBRL=s=>{if(!s)return 0;return parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0};
const calcComb=(km,kml,vl)=>(km&&kml&&vl&&kml>0)?(km/kml)*vl:0;
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad=n=>String(n).padStart(2,'0');
const CLIENTES=['Consórcio 3AB','Consórcio 2C','Consórcio 10C','Carioca Itaquera','BRT','Mananciais'];
const normCl=c=>{const m={'3AB':'Consórcio 3AB','2C':'Consórcio 2C','10C':'Consórcio 10C','Carioca Castilho':'Carioca Itaquera','Carioca Castilho ':'Carioca Itaquera'};return m[c]||m[(c||'').trim()]||c;};
const mesOrder=r=>{const ms={Janeiro:1,Fevereiro:2,Março:3,Abril:4,Maio:5,Junho:6,Julho:7,Agosto:8,Setembro:9,Outubro:10,Novembro:11,Dezembro:12};const p=(r||'').split(/[\s\/]+/);let y=0,m=0;p.forEach(x=>{if(ms[x])m=ms[x];const n=parseInt(x);if(n>2000)y=n;else if(n>=24&&n<=30)y=2000+n;});return y*100+m;};
function getPeriodos(start,end){const ps=[];let d=new Date(start+'T12:00:00');const e=new Date(end+'T12:00:00');while(d<=e){const n=new Date(d);n.setMonth(n.getMonth()+1);ps.push({inicio:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),label:pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' → '+pad(n.getDate())+'/'+pad(n.getMonth()+1)+'/'+n.getFullYear()});d=n;}return ps;}
function getTot(sd){const v=DB.veiculos.find(x=>x.id===sd.veiculoId);return(v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0))+(sd.pedagio||0)+(sd.refeicao||0)+(sd.outros||0);}

let curTab='painel';
const TABS=[{id:'painel',icon:'📊',label:'Painel'},{id:'fat',icon:'💰',label:'Faturamento'},{id:'saidas',icon:'🚗',label:'Saídas'},{id:'fixos',icon:'📋',label:'Previsões'},{id:'clientes',icon:'🏢',label:'Clientes'},{id:'producao',icon:'📝',label:'Produção'},{id:'relatorio',icon:'📈',label:'Relatório'},{id:'config',icon:'⚙️',label:'Config'}];

function renderNav(){
  let nP=0;DB.obrigacoes.filter(o=>o.ativo).forEach(ob=>{const tp=ob.totalParcelas||0;const pc=DB.provisoes.filter(pv=>pv.obrigacaoId===ob.id).length;if(tp>0&&pc>=tp)return;const ed=tp>0?(()=>{const d=new Date(ob.dataInicio+'T12:00:00');d.setMonth(d.getMonth()+tp);return d.toISOString().slice(0,10);})():'2026-07-31';getPeriodos(ob.dataInicio,ed).forEach(p=>{if(!DB.provisoes.some(pv=>pv.obrigacaoId===ob.id&&pv.periodoInicio===p.inicio))nP++;});});
  const nFP=DB.faturamento.filter(f=>f.status!=='Pago').length;
  const icons={painel:'fa-chart-pie',fat:'fa-money-bill-wave',saidas:'fa-car',fixos:'fa-clipboard-list',clientes:'fa-building',producao:'fa-file-invoice',relatorio:'fa-chart-line',config:'fa-gear',logs:'fa-clock-rotate-left'};
  document.getElementById('nav').innerHTML=TABS.map(t=>`<div class="nav-item${curTab===t.id?' active':''}" onclick="switchTab('${t.id}')"><i class="fa-solid ${icons[t.id]||'fa-circle'}"></i> ${t.label}${t.id==='painel'&&nP>0?`<span class="nav-badge">${nP}</span>`:''}${t.id==='fat'&&nFP>0?`<span class="nav-badge">${nFP}</span>`:''}</div>`).join('');
  document.getElementById('page-title').textContent=TABS.find(t=>t.id===curTab)?.label||'';
}
window.switchTab=function(id){curTab=id;document.querySelectorAll('.tab-pane').forEach(el=>el.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');renderNav();render();};

function renderPainel(){
  const el=document.getElementById('tab-painel');const alertas=[];
  DB.obrigacoes.filter(o=>o.ativo).forEach(ob=>{
    const totalParc=ob.totalParcelas||0;const provCount=DB.provisoes.filter(pv=>pv.obrigacaoId===ob.id).length;
    if(totalParc>0&&provCount>=totalParc)return;
    const endDate=totalParc>0?(()=>{const d=new Date(ob.dataInicio+'T12:00:00');d.setMonth(d.getMonth()+totalParc);return d.toISOString().slice(0,10);})():'2026-07-31';
    getPeriodos(ob.dataInicio,endDate).forEach(p=>{if(!DB.provisoes.some(pv=>pv.obrigacaoId===ob.id&&pv.periodoInicio===p.inicio))alertas.push({tipo:'p',nome:ob.nome,valor:ob.valor,periodo:p.label,pi:p.inicio,obId:ob.id});});
    const ns=new Date('2026-07-31T12:00:00');ns.setDate(new Date(ob.dataInicio+'T12:00:00').getDate());if(ns<=new Date('2026-07-31T12:00:00'))ns.setMonth(ns.getMonth()+1);const ne=new Date(ns);ne.setMonth(ne.getMonth()+1);
    const nl=pad(ns.getDate())+'/'+pad(ns.getMonth()+1)+'/'+ns.getFullYear()+' \u2192 '+pad(ne.getDate())+'/'+pad(ne.getMonth()+1)+'/'+ne.getFullYear();
    const nsPi=ns.toISOString().slice(0,10);
    if(totalParc>0){const endD=new Date(ob.dataInicio+'T12:00:00');endD.setMonth(endD.getMonth()+totalParc);if(ns>=endD)return;}
    if(!DB.provisoes.some(pv=>pv.obrigacaoId===ob.id&&pv.periodoInicio===nsPi))alertas.push({tipo:'n',nome:ob.nome,valor:ob.valor,periodo:nl,pi:nsPi,obId:ob.id});
  });
  const per=alertas.filter(a=>a.tipo==='p'),prx=alertas.filter(a=>a.tipo==='n');
  const fatP=DB.faturamento.filter(f=>f.status==='Pago').reduce((s,f)=>s+(f.valorTotal||0),0);
  const fatPend=DB.faturamento.filter(f=>f.status!=='Pago').reduce((s,f)=>s+(f.valorTotal||0),0);
  document.getElementById('top-metrics').innerHTML='';
  let h='';
  if(per.length>0){
    h+=`<div class="alert-group"><div class="alert-header danger" style="cursor:pointer" onclick="this.nextElementSibling.classList.toggle('open')"><i class="fa-solid fa-triangle-exclamation"></i> Provisão pendente (${per.length}) <span style="margin-left:auto;font-size:.8rem">${fmt(per.reduce((s,a)=>s+a.valor,0))} <i class="fa-solid fa-chevron-down"></i></span></div><div class="alert-list">`;
    per.forEach(a=>{h+=`<div class="alert-item"><div class="alert-info"><h4>${esc(a.nome)}</h4><p>${a.periodo}</p></div><div style="display:flex;align-items:center"><span class="alert-value" style="color:var(--danger-text)">${fmt(a.valor)}</span><button class="btn-primary" style="background:var(--danger);padding:6px 12px;font-size:.8rem" onclick="provM('${a.obId}','${a.pi}','${a.periodo}',${a.valor})">Provisionar</button></div></div>`;});
    h+=`</div></div>`;
  }else{h+=`<div class="alert-group"><div class="alert-header" style="background:var(--success-bg);color:var(--success-text)"><i class="fa-solid fa-check-circle"></i> Provisões em dia</div></div>`;}
  if(prx.length>0){
    h+=`<div class="alert-group"><div class="alert-header warning" style="cursor:pointer" onclick="this.nextElementSibling.classList.toggle('open')"><i class="fa-solid fa-calendar-day"></i> Próximo ciclo (${prx.length}) <span style="margin-left:auto;font-size:.8rem">${fmt(prx.reduce((s,a)=>s+a.valor,0))} <i class="fa-solid fa-chevron-down"></i></span></div><div class="alert-list">`;
    prx.forEach(a=>{h+=`<div class="alert-item"><div class="alert-info"><h4>${esc(a.nome)}</h4><p>${a.periodo}</p></div><div style="display:flex;align-items:center"><span class="alert-value" style="color:var(--warning-text)">${fmt(a.valor)}</span><button class="btn-primary" style="background:var(--warning);padding:6px 12px;font-size:.8rem" onclick="provM('${a.obId}','${a.pi}','${a.periodo}',${a.valor})">Provisionar</button></div></div>`;});
    h+=`</div></div>`;
  }
  h+=`<div class="summary-cards-row"><div class="summary-card blue"><h3>Faturamento total</h3><div class="value">${fmt(fatP+fatPend)}</div></div><div class="summary-card green"><h3>Recebido</h3><div class="value">${fmt(fatP)}</div></div><div class="summary-card orange"><h3>Pendente</h3><div class="value">${fmt(fatPend)}</div></div></div>`;
  el.innerHTML=h;
}

function sortFat(arr){return[...arr].sort((a,b)=>mesOrder(b.mesRef)-mesOrder(a.mesRef));}
function renderFatCard(f){
    const isPago=f.status==='Pago';
    const arqs=f.arquivos||[];
    let h=`<div class="fat-card ${isPago?'st-pago':'st-pend'}">
      <div class="card-header">
        <div><h4 style="font-size:1rem;color:var(--text-dark);margin-bottom:2px">${esc(f.mesRef)}</h4>
        <span style="font-size:.8rem;color:var(--text-muted)">${f.nf?`NF: ${esc(f.nf)}`:'Sem NF'}</span></div>
        <div style="text-align:right"><div style="font-size:1.1rem;font-weight:700">${fmt(f.valorTotal)}</div>
        <span class="status-tag ${isPago?'pago':'pend'}">${f.status}</span></div>
      </div>`;

    // Details grid
    const hasDetails=(f.envioMedicao&&f.envioMedicao!=='NaT')||(f.emissaoNF&&f.emissaoNF!=='NaT')||(f.prevPagamento&&f.prevPagamento!=='NaT')||(f.dataDeposito&&f.dataDeposito!=='NaT');
    if(hasDetails){
      h+=`<div class="card-details">`;
      if(f.envioMedicao&&f.envioMedicao!=='NaT')h+=`<div class="detail-item"><span>Envio medição</span><strong>${fmtD(f.envioMedicao)}</strong></div>`;
      if(f.emissaoNF&&f.emissaoNF!=='NaT')h+=`<div class="detail-item"><span>Emissão NF</span><strong>${fmtD(f.emissaoNF)}</strong></div>`;
      if(f.prevPagamento&&f.prevPagamento!=='NaT')h+=`<div class="detail-item"><span>Previsão pagamento</span><strong>${fmtD(f.prevPagamento)}</strong></div>`;
      if(f.dataDeposito&&f.dataDeposito!=='NaT')h+=`<div class="detail-item"><span>Depósito</span><strong>${fmtD(f.dataDeposito)}</strong></div>`;
      if(f.obs)h+=`<div class="detail-item" style="grid-column:span 2"><span style="color:var(--warning-text)"><i class="fa-solid fa-triangle-exclamation"></i> Aviso</span><strong>${esc(f.obs)}</strong></div>`;
      h+=`</div>`;
    }

    // Arquivos
    if(arqs.length>0){
      h+=`<div style="display:flex;gap:8px;flex-wrap:wrap">`;
      arqs.forEach((a,i)=>{
        const isImg=a.nome.match(/\.(jpg|jpeg|png|gif|webp)$/i);
        const tipoBg=a.tipo==='Nota Fiscal'?'var(--success)':a.tipo==='Medição'?'var(--primary)':'var(--text-muted)';
        const tipoIcon=a.tipo==='Nota Fiscal'?'fa-file-invoice-dollar':a.tipo==='Medição'?'fa-ruler-combined':'fa-file';
        h+=`<div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:2px">
        ${isImg?`<img src="${a.url}" class="nf-thumb" onclick="viewFile('${a.url}')">`:`<div class="nf-thumb" style="display:flex;align-items:center;justify-content:center;font-size:18px;background:#f1f5f9" onclick="viewFile('${a.url}')"><i class="fa-solid ${tipoIcon}" style="color:${tipoBg}"></i></div>`}
        <span style="font-size:.6rem;font-weight:600;color:${tipoBg};text-transform:uppercase">${esc(a.tipo||'Arquivo')}</span>
        <button style="position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="delNF('${f.id}','${a.path}',${i})">✕</button></div>`;
      });
      h+=`</div>`;
    }

    // Actions
    h+=`<div class="card-actions">
      <button class="attach-btn" onclick="uploadNF('${f.id}')"><i class="fa-solid fa-paperclip"></i> Anexar documento</button>
      <div style="display:flex;gap:4px"><span id="upload-status-${f.id}" style="font-size:.7rem"></span>
      <button class="btn-icon check" title="${isPago?'Marcar pendente':'Marcar como pago'}" onclick="toggleFat('${f.id}')"><i class="fa-solid ${isPago?'fa-arrow-rotate-left':'fa-square-check'}"></i></button>
      <button class="btn-icon edit" title="Editar" onclick="editFat('${f.id}')"><i class="fa-solid fa-pen"></i></button>
      <button class="btn-icon" title="Acerto" onclick="gerarResumo('${f.id}')"><i class="fa-solid fa-file-lines"></i></button>
      </div></div></div>`;
    return h;
}

function renderFat(){
  const el=document.getElementById('tab-fat');
  const allFat=sortFat(DB.faturamento);
  const pagos=allFat.filter(f=>f.status==='Pago');
  const pend=allFat.filter(f=>f.status!=='Pago');

  // Update topbar metrics
  document.getElementById('top-metrics').innerHTML=`
    <div class="metric-pill success"><span class="label">Total Recebido (${pagos.length})</span><span class="value">${fmt(pagos.reduce((s,f)=>s+f.valorTotal,0))}</span></div>
    <div class="metric-pill warning"><span class="label">Total Pendente (${pend.length})</span><span class="value">${fmt(pend.reduce((s,f)=>s+f.valorTotal,0))}</span></div>
    <button class="btn-primary" onclick="novoFat()"><i class="fa-solid fa-plus"></i> Novo Registro</button>`;

  // Group by client
  const porCliente={};
  allFat.forEach(f=>{const cl=normCl(f.clienteNorm||f.cliente);if(!porCliente[cl])porCliente[cl]=[];porCliente[cl].push(f);});
  const clKeys=Object.keys(porCliente).sort();

  let h=`<h2 style="font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);font-weight:600;margin-bottom:16px">Faturamentos por Cliente</h2>`;

  clKeys.forEach(cl=>{
    const fats=porCliente[cl];
    const clPend=fats.filter(f=>f.status!=='Pago');
    const clPago=fats.filter(f=>f.status==='Pago');
    const initials=cl.replace(/Consórcio\s*/i,'').slice(0,2).toUpperCase();

    h+=`<details class="client-group">
    <summary class="client-header">
      <div class="client-info"><div class="client-avatar">${initials}</div>
      <div><div class="client-name">${esc(cl)}</div><div class="client-sub">Cliente corporativo</div></div></div>
      <div class="client-stats">
        ${clPend.length?`<div class="stat-badge pendente"><i class="fa-solid fa-hourglass-half"></i> ${clPend.length} Pendente${clPend.length>1?'s':''}</div>`:`<div class="stat-badge zero">0 Pendentes</div>`}
        ${clPago.length?`<div class="stat-badge pago"><i class="fa-solid fa-check"></i> ${clPago.length} Pago${clPago.length>1?'s':''}</div>`:`<div class="stat-badge zero">0 Pagos</div>`}
        <i class="fa-solid fa-chevron-down chevron"></i>
      </div>
    </summary>
    <div class="client-content"><div class="cards-grid">`;
    sortFat(fats).forEach(f=>{h+=renderFatCard(f);});
    h+=`</div></div></details>`;
  });

  if(!clKeys.length)h+=`<div class="emp">Nenhum faturamento cadastrado.</div>`;
  el.innerHTML=h;
}

// ═══════ RESUMO (estilo planilha Excel) ═══════
window.gerarResumo=function(fatId){
  const f=DB.faturamento.find(x=>x.id===fatId);if(!f)return;
  const cl=f.clienteNorm||f.cliente;
  const med=DB.medicoes.find(m=>m.consorcio===cl&&f.mesRef&&f.mesRef.includes(m.mesRef));
  const ss=med?DB.saidas.filter(s=>s.medicaoId===med.id).sort((a,b)=>(a.data||'').localeCompare(b.data||'')):[];

  // Totais por categoria
  let totComb=0,totPed=0,totRef=0,totGeral=0;
  ss.forEach(sd=>{
    const v=DB.veiculos.find(x=>x.id===sd.veiculoId);
    const c=v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0);
    totComb+=c;totPed+=(sd.pedagio||0);totRef+=(sd.refeicao||0);
    totGeral+=c+(sd.pedagio||0)+(sd.refeicao||0)+(sd.outros||0);
  });

  // Imposto — pega do faturamento ou da medição
  const imposto=f.imposto||0||(med?med.imposto||0:0);

  // Provisão David (obrigações do período)
  const provs=DB.provisoes.filter(p=>{
    const ob=DB.obrigacoes.find(o=>o.id===p.obrigacaoId);
    return ob&&(p.ref||'').toLowerCase().includes(cl.toLowerCase().slice(0,4));
  });
  const totProvPrev=provs.reduce((s,p)=>s+p.valor,0);
  const totProvReal=provs.reduce((s,p)=>s+(p.valorReal!=null?p.valorReal:p.valor),0);
  const provDiff=totProvPrev-totProvReal;

  // Ajuda de custo veículo
  const ajudaCusto=DB.ajudaCustoVeiculo||0;

  // Cálculos (usa gasto REAL quando disponível)
  const despTatiana=totGeral;
  const totalDespesas=despTatiana+imposto+totProvReal+ajudaCusto;
  const valorPagamento=f.valorTotal-imposto;
  const valorLiquido=valorPagamento-despTatiana-totProvReal-ajudaCusto;

  // Divisão 50/50
  const metade=valorLiquido/2;
  const tatianaRecebe=metade+despTatiana+ajudaCusto+totProvReal;
  const ronaldoRecebe=metade-ajudaCusto;

  // Gerar HTML do resumo estilo planilha
  const fv=v=>(v==null||isNaN(v))?'0,00':v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

  let html=`<div style="font-family:'Courier New',monospace;font-size:12px;line-height:1.7;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;overflow-x:auto">
  <div style="text-align:center;font-weight:700;font-size:14px;margin-bottom:10px;border-bottom:2px solid #334155;padding-bottom:6px">ACERTO ${esc(normCl(cl).toUpperCase())} — Medição ${esc(f.mesRef)}</div>`;

  // Tabela de saídas
  if(ss.length){
    html+=`<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px">
    <tr style="background:#334155;color:#fff;text-align:left"><th style="padding:3px 5px">Dias</th><th style="padding:3px 5px">Local</th><th style="padding:3px 5px;text-align:right">Combustível</th><th style="padding:3px 5px;text-align:right">Pedágio</th><th style="padding:3px 5px;text-align:right">Refeição</th><th style="padding:3px 5px;text-align:right">Total</th></tr>`;
    ss.forEach((sd,i)=>{
      const v=DB.veiculos.find(x=>x.id===sd.veiculoId);
      const c=v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0);
      const t=c+(sd.pedagio||0)+(sd.refeicao||0)+(sd.outros||0);
      const bg=i%2===0?'#fff':'#f1f5f9';
      html+=`<tr style="background:${bg}"><td style="padding:3px 5px">${fmtD(sd.data)}</td><td style="padding:3px 5px">${esc(sd.local)}</td><td style="padding:3px 5px;text-align:right">${fv(c)}</td><td style="padding:3px 5px;text-align:right">${fv(sd.pedagio)}</td><td style="padding:3px 5px;text-align:right">${fv(sd.refeicao)}</td><td style="padding:3px 5px;text-align:right;font-weight:600">${fv(t)}</td></tr>`;
    });
    html+=`<tr style="background:#e2e8f0;font-weight:700"><td colspan="2" style="padding:3px 5px">TOTAL</td><td style="padding:3px 5px;text-align:right">${fv(totComb)}</td><td style="padding:3px 5px;text-align:right">${fv(totPed)}</td><td style="padding:3px 5px;text-align:right">${fv(totRef)}</td><td style="padding:3px 5px;text-align:right">${fv(totGeral)}</td></tr></table>`;
  }

  // Despesas
  html+=`<div style="border:1px solid #d1d5db;border-radius:6px;padding:8px;margin-bottom:10px;background:#fff">
  <div style="font-weight:700;margin-bottom:4px;color:#334155">DESPESAS</div>
  <div style="display:flex;justify-content:space-between;padding:2px 0"><span>Despesas Tatiana</span><span>${fv(despTatiana)}</span></div>
  <div style="display:flex;justify-content:space-between;padding:2px 0"><span>Imposto medição</span><span>${fv(imposto)}</span></div>`;
  if(provs.length>0){
    provs.forEach(p=>{const ob=DB.obrigacoes.find(o=>o.id===p.obrigacaoId);const vr=p.valorReal!=null?p.valorReal:p.valor;const d=p.valor-vr;
      html+=`<div style="display:flex;justify-content:space-between;padding:2px 0"><span>${ob?.tipo==='reembolso'?'💳':ob?.tipo==='desconto'?'🔻':'📌'} ${esc(ob?ob.nome:'Func.')}</span><span>${p.valorReal!=null?`<span style="text-decoration:line-through;color:#94a3b8;margin-right:4px">${fv(p.valor)}</span>${fv(vr)}`:fv(p.valor)}</span></div>`;
      if(d>0)html+=`<div style="display:flex;justify-content:space-between;padding:1px 0;font-size:11px;color:#1d4ed8"><span style="padding-left:12px">↩ diferença devolvida ao pool</span><span>+${fv(d)}</span></div>`;
    });
  }else{
    html+=`<div style="display:flex;justify-content:space-between;padding:2px 0"><span>Prev. Pagamento (Funcionário)</span><span>0,00</span></div>`;
  }
  html+=`<div style="display:flex;justify-content:space-between;padding:2px 0"><span>Ajuda de custo veículo</span><span>${fv(ajudaCusto)}</span></div>
  <div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid #334155;font-weight:700;margin-top:4px"><span>Total Despesas</span><span>${fv(totalDespesas)}</span></div></div>`;

  // Valores
  html+=`<div style="border:1px solid #d1d5db;border-radius:6px;padding:8px;margin-bottom:10px;background:#fff">

window.exportResumoImg=async function(cl,mes){
  const el=document.getElementById('resumo-content');if(!el)return;
  // Load html2canvas if not loaded
  if(!window.html2canvas){
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    document.head.appendChild(s);
    await new Promise((r,j)=>{s.onload=r;s.onerror=()=>j(new Error('Falha ao carregar'));setTimeout(r,5000);});
  }
  try{
    const canvas=await html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true});
    const link=document.createElement('a');
    link.download=`Acerto_${cl.replace(/\\s+/g,'_')}_${mes.replace(/\\s+/g,'_')}.png`;
    link.href=canvas.toDataURL('image/png');

window.sfCliente='';window.sfMed='';
function renderSaidas(){
  const el=document.getElementById('tab-saidas');
  const clientes=[...new Set(DB.medicoes.map(m=>normCl(m.consorcio)))].sort();
  const mesesDoCliente=window.sfCliente?DB.medicoes.filter(m=>normCl(m.consorcio)===window.sfCliente).sort((a,b)=>mesOrder(b.mesRef)-mesOrder(a.mesRef)):[];
  document.getElementById('top-metrics').innerHTML=`<button class="btn-danger" id="btn-del-saidas" style="display:none;margin-right:8px" onclick="delSelectedSaidas()"><i class="fa-solid fa-trash"></i> Excluir selecionados</button><button class="btn-primary" onclick="novaSaida()"><i class="fa-solid fa-plus"></i> Nova saída</button>`;
  const fl=DB.saidas.filter(x=>{
    if(!window.sfCliente&&!window.sfMed)return true;
    if(window.sfMed)return x.medicaoId===window.sfMed;
    if(window.sfCliente){const mids=DB.medicoes.filter(m=>normCl(m.consorcio)===window.sfCliente).map(m=>m.id);return mids.includes(x.medicaoId);}
    return true;
  }).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  let tF=fl.reduce((s,sd)=>s+getTot(sd),0);
  let h=`<div class="filters-row"><select class="filter-input" style="flex:1" onchange="window.sfCliente=this.value;window.sfMed='';renderSaidas()"><option value="">Todos os clientes</option>${clientes.map(c=>`<option value="${esc(c)}"${window.sfCliente===c?' selected':''}>${esc(c)}</option>`).join('')}</select>
  <select class="filter-input" style="flex:1" onchange="window.sfMed=this.value;renderSaidas()"${!window.sfCliente?' disabled':''}><option value="">Todas as medições</option>${mesesDoCliente.map(m=>`<option value="${m.id}"${window.sfMed===m.id?' selected':''}>${esc(m.mesRef)}</option>`).join('')}</select></div>`;
  h+=`<div class="total-banner"><div><span class="lbl">${fl.length} saídas</span></div><div><span class="val">${fmt(tF)}</span></div></div>`;
  h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><label style="display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer"><input type="checkbox" onchange="document.querySelectorAll('.chk-saida').forEach(x=>x.checked=this.checked);updDelBtn('saidas')"> Selecionar todos</label></div><div class="data-list">`;
  fl.slice(0,60).forEach(sd=>{const tot=getTot(sd);const v=DB.veiculos.find(x=>x.id===sd.veiculoId);const comb=v?calcComb(sd.km,v.kml,sd.valorLitro):(sd.combManual||0);
    const medNm=sd.medicaoId?DB.medicoes.find(m=>m.id===sd.medicaoId):null;
    h+=`<div class="data-row"><div class="data-col-main"><div class="data-row-title"><span class="tag-user">${esc(sd.quemPagou||'Tatiana')}</span> ${fmtD(sd.data)}</div>
    <div class="data-row-desc"><span><i class="fa-solid fa-location-dot"></i> ${esc(sd.local)}</span>${medNm?`<span style="color:var(--primary);font-weight:600">${esc(normCl(medNm.consorcio))} ${esc(medNm.mesRef)}</span>`:''}</div>
    <div class="data-row-desc">${comb>0?`<span><i class="fa-solid fa-gas-pump"></i> ${fmt(comb)}</span>`:''}${sd.pedagio>0?`<span><i class="fa-solid fa-road"></i> ${fmt(sd.pedagio)}</span>`:''}${sd.refeicao>0?`<span><i class="fa-solid fa-utensils"></i> ${fmt(sd.refeicao)}</span>`:''}</div>
    </div><div class="data-col-val">${fmt(tot)}<i class="fa-solid fa-trash btn-icon-danger" onclick="delSd('${sd.id}')"></i></div></div>`;
  });
  h+=`</div>`;
  if(!fl.length)h+=`<div class="empty-state"><i class="fa-solid fa-car"></i><p>Nenhuma saída encontrada.</p></div>`;
  el.innerHTML=h;
}

window.updSfLocais=function(){const cl=document.getElementById('sf-cl').value;if(!cl){document.getElementById('sf-locais-cli').innerHTML='';return;}
  const mids=DB.medicoes.filter(m=>normCl(m.consorcio)===cl).map(m=>m.id);
  const locaisCli=[...new Set(DB.saidas.filter(s=>mids.includes(s.medicaoId)).map(s=>s.local).filter(Boolean))].sort();

  document.getElementById('sf-locais-cli').innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:4px">${locaisCli.map(l=>`<button type="button" style="padding:3px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;font-size:12px;color:#1d4ed8;cursor:pointer" onclick="document.getElementById('sf-l').value='${esc(l)}'">${esc(l)}</button>`).join('')}</div>`;
};
window.salvarSd=async function(){
  const vcId=document.getElementById('sf-vc')?.value||'';
  const km=parseFloat(document.getElementById('sf-km')?.value)||0;
  const vc=DB.veiculos.find(v=>v.id===vcId);
  let medId=document.getElementById('sf-m').value;
  const cl=document.getElementById('sf-cl').value;
  // Handle "Próxima medição" — create a temporary medição for current month
  if(medId==='__proxima__'&&cl){
    const now=new Date();const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const mesRef=meses[now.getMonth()]+' '+now.getFullYear();
    let existMed=DB.medicoes.find(m=>normCl(m.consorcio)===cl&&m.mesRef===mesRef);
    if(!existMed){existMed={id:uid(),consorcio:cl.replace(/^Consórcio\s*/i,''),mesRef,imposto:0};DB.medicoes.push(existMed);}
    medId=existMed.id;
  }
  const e={id:uid(),data:document.getElementById('sf-d').value,local:document.getElementById('sf-l').value,
    veiculoId:vcId,km,valorLitro:DB.precoLitro,combManual:0,
    pedagio:parseBRL(document.getElementById('sf-p').value),refeicao:parseBRL(document.getElementById('sf-r').value),
    outros:0,outrosDesc:'',quemPagou:document.getElementById('sf-q').value,medicaoId:medId,obs:'',reembolsado:true};
  if(!e.data||!e.local)return alert('Preencha data e local');DB.saidas.push(e);await saveDB('Saída criada',e.local+' '+e.data);renderSaidas();
};
window.delSd=async function(id){if(confirm('Excluir esta saída?')){DB.saidas=DB.saidas.filter(x=>x.id!==id);await saveDB('Saída excluída',id);renderSaidas();}};

function renderFixos(){
  const el=document.getElementById('tab-fixos');
  document.getElementById('top-metrics').innerHTML=`<button class="btn-primary" onclick="novaOb()"><i class="fa-solid fa-plus"></i> Nova previsão</button>`;
  let h='';
  DB.obrigacoes.forEach(o=>{
    const ps=DB.provisoes.filter(p=>p.obrigacaoId===o.id).sort((a,b)=>a.periodoInicio.localeCompare(b.periodoInicio));
    const tipo=o.tipo||'provisao';const totalParc=o.totalParcelas||0;
    const tipoLabel=tipo==='reembolso'?'Reembolso':tipo==='desconto'?'Desconto':'Provisão';
    const tagClass=tipo==='desconto'?'tag-desc':'tag-prev';
    const concluido=totalParc>0&&ps.length>=totalParc;
    const pct=totalParc>0?Math.min(100,Math.round(ps.length/totalParc*100)):0;
    h+=`<div class="prev-card"${concluido?' style="opacity:.6"':''}>
    <div class="prev-header"><div class="prev-title"><span class="${tagClass}">${tipoLabel}</span><div><h3>${esc(o.nome)}${concluido?' <span style="color:var(--success)">\u2713 Quitado</span>':''}</h3><p class="prev-subtitle">${fmt(o.valor)}/mês · Início: ${fmtD(o.dataInicio)}${totalParc>0?` · ${ps.length}/${totalParc} parcelas`:' · Indeterminado'}${o.desc?' · '+esc(o.desc):''}</p></div></div>
    <button class="btn-icon-danger" onclick="delOb('${o.id}')"><i class="fa-solid fa-trash"></i></button></div>`;
    if(totalParc>0){h+=`<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%${concluido?';background:var(--success)':''}"></div></div>`;}
    if(ps.length){
      h+=`<div class="prev-items"><div class="progress-lbl"><i class="fa-solid fa-check-double"></i> ${ps.length} meses provisionados</div>`;
      ps.forEach(p=>{const temReal=p.valorReal!=null;
        h+=`<div class="prev-item"><span class="date">${p.periodo}</span><span class="val">${temReal?`<s style="color:var(--text-muted);margin-right:6px">${fmt(p.valor)}</s>${fmt(p.valorReal)}`:fmt(p.valor)} <span style="color:var(--text-muted);font-weight:400">${esc(p.ref)}</span>
        <button class="btn-icon edit" onclick="editProvReal('${p.id}')"><i class="fa-solid fa-dollar-sign"></i></button>
        <i class="fa-solid fa-xmark btn-icon-danger" onclick="delProv('${p.id}')"></i></span></div>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  if(DB.obrigacoes.length)h+=`<button class="btn-secondary" style="margin-top:12px" onclick="novaProv()"><i class="fa-solid fa-plus"></i> Lançar período</button>`;
  if(!DB.obrigacoes.length)h+=`<div class="empty-state"><i class="fa-solid fa-clipboard-list"></i><p>Nenhuma previsão cadastrada.</p><button class="btn-primary" onclick="novaOb()"><i class="fa-solid fa-plus"></i> Nova previsão</button></div>`;
  el.innerHTML=h;
}

  <label class="lb">Tipo</label><select class="sel" id="of-t"><option value="provisao">📌 Provisão (despesa a ser provisionada)</option><option value="reembolso">💳 Reembolso (volta pro bolso de quem pagou)</option><option value="desconto">🔻 Desconto (descontado do pagamento)</option></select>
  <label class="lb">Nome</label><input class="inp" id="of-n" placeholder="Ex: Celular Samsung">
  <div class="row"><div style="flex:1"><label class="lb">Valor/mês</label><input class="inp" id="of-v"></div><div style="flex:1"><label class="lb">Parcelas</label><input class="inp" type="number" id="of-pc" placeholder="0 = indefinido" min="0"></div></div>
  <div class="row"><div style="flex:1"><label class="lb">Início</label><input class="inp" type="date" id="of-d"></div><div style="flex:1"><label class="lb">Desc</label><input class="inp" id="of-ds"></div></div>

window.novaProv=function(){document.getElementById('tab-fixos').innerHTML=`<div class="fc"><h3 style="margin:0 0 10px;font-size:14px;font-weight:700">Lançar período</h3><label class="lb">Obrigação</label><select class="sel" id="pf-o" onchange="upPP()"><option value="">Selecione</option>${DB.obrigacoes.filter(o=>{const tp=o.totalParcelas||0;if(tp<=0)return true;return DB.provisoes.filter(p=>p.obrigacaoId===o.id).length<tp;}).map(o=>`<option value="${o.id}">${esc(o.nome)} ${o.tipo==='reembolso'?'💳':'👷'}</option>`).join('')}</select><div id="pf-f"></div>

function renderClienteDetalhe(el,clId){

function renderProducao(){
  const el=document.getElementById('tab-producao');

  const totalVist=DB.producao.reduce((s,p)=>s+p.quantidade,0);

  let h=`<div class="summary-cards-row" style="grid-template-columns:1fr 1fr;margin-bottom:24px"><div class="summary-card blue"><h3>Total vistorias</h3><div class="value">${totalVist}</div></div><div class="summary-card green"><h3>Valor produzido</h3><div class="value">${fmt(totalValor)}</div></div></div>`;

  const clKeys=Object.keys(porCliente).sort();

  if(clKeys.length){
    clKeys.forEach(cl=>{
      const prods=porCliente[cl].sort((a,b)=>mesOrder(b.mesRef)-mesOrder(a.mesRef));
      const totCl=prods.reduce((s,p)=>s+p.quantidade,0);
      const valCl=prods.reduce((s,p)=>s+p.quantidade*(p.valorUnitario||0),0);
      const initials=cl.replace(/Consórcio\s*/i,'').slice(0,2).toUpperCase();

      // Group by month within client
      const porMes={};
      prods.forEach(p=>{if(!porMes[p.mesRef])porMes[p.mesRef]=[];porMes[p.mesRef].push(p);});

      h+=`<details class="client-group">
      <summary class="client-header">
        <div class="client-info"><div class="client-avatar">${initials}</div>
        <div><div class="client-name">${esc(cl)}</div><div class="client-sub">${totCl} vistorias · ${fmt(valCl)}</div></div></div>
        <div class="client-stats">
          <div class="stat-badge pago"><i class="fa-solid fa-chart-bar"></i> ${totCl} vistorias</div>
          <div class="stat-badge" style="background:#eff6ff;color:var(--primary)">${fmt(valCl)}</div>
          <i class="fa-solid fa-chevron-down chevron"></i>
        </div>
      </summary>
      <div class="client-content">`;

      Object.entries(porMes).forEach(([mes,items])=>{
        const totMes=items.reduce((s,p)=>s+p.quantidade,0);
        const valMes=items.reduce((s,p)=>s+p.quantidade*(p.valorUnitario||0),0);
        h+=`<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)"><strong style="font-size:.95rem">${esc(mes)}</strong><span style="font-size:.85rem;color:var(--success);font-weight:600">${totMes}x · ${fmt(valMes)}</span></div>`;
        items.forEach(p=>{
          const val=p.valorUnitario||0;
          h+=`<div class="prev-item"><span><i class="fa-solid fa-location-dot" style="color:var(--text-muted);margin-right:4px"></i>${esc(p.coletorNome||'Geral')} · <span style="color:#7c3aed;font-weight:500">${esc(p.tipoRelatorio)}</span></span>
          <span class="val">${p.quantidade}x${val?` · ${fmt(p.quantidade*val)}`:''}<button class="btn-icon edit" style="margin-left:4px" onclick="editProducao('${p.id}')"><i class="fa-solid fa-pen"></i></button><i class="fa-solid fa-trash btn-icon-danger" style="margin-left:4px" onclick="delProducao('${p.id}')"></i></span></div>`;
        });
        h+=`</div>`;
      });

      h+=`</div></details>`;
    });
  }else{
    h+=`<div class="empty-state"><i class="fa-solid fa-file-invoice"></i><p>Nenhum registro. Clique em "+ Lançar" para começar.</p></div>`;
  }
  el.innerHTML=h;
}

window._editProdId='';
function prodForm(p){
  const el=document.getElementById('tab-producao');
  const isEdit=!!p;
  window._editProdId=isEdit?p.id:'';
  const clOpts=vcClientes.length?vcClientes.map(c=>`<option value="${c.id}"${isEdit&&p.clienteId===c.id?' selected':''}>${esc(c.nome)}</option>`).join(''):CLIENTES.map(c=>`<option value="${esc(c)}"${isEdit&&p.clienteId===c?' selected':''}>${esc(c)}</option>`).join('');
  el.innerHTML=`<div class="fc"><h3 style="margin:0 0 12px;font-size:16px;font-weight:700">${isEdit?'Editar':'Lançar'} produção</h3>
  <div class="row"><div style="flex:1"><label class="lb">Mês/Ano</label><input class="inp" id="pd-mes" placeholder="Julho 2026" value="${isEdit?esc(p.mesRef):''}"></div><div style="flex:1"><label class="lb">Tipo relatório</label><select class="sel" id="pd-tipo">${TIPOS_REL.map(t=>`<option${isEdit&&p.tipoRelatorio===t?' selected':''}>${t}</option>`).join('')}</select></div></div>
  <div class="row"><div style="flex:1"><label class="lb">Cliente</label><select class="sel" id="pd-cl" onchange="updPdCol()"><option value="">Selecione</option>${clOpts}</select></div>
  <div style="flex:1"><label class="lb">Coletor</label><select class="sel" id="pd-col"><option value="">Todos / Geral</option></select></div></div>
  <div class="row"><div style="flex:1"><label class="lb">Quantidade de vistorias</label><input class="inp" type="number" id="pd-qt" min="1" value="${isEdit?p.quantidade:1}"></div></div>
  ${!isEdit?`<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.875rem;cursor:pointer"><input type="checkbox" id="pd-fat" checked> Criar/atualizar faturamento automaticamente</label>`:''}
  <div class="acts">${isEdit?`<button class="btn-danger" onclick="delProducao('${p.id}')" style="margin-right:auto"><i class="fa-solid fa-trash"></i> Excluir</button>`:''}<button class="btn-secondary" onclick="renderProducao()">Cancelar</button><button class="btn-primary" onclick="salvarProducao()"><i class="fa-solid fa-check"></i> ${isEdit?'Atualizar':'Salvar'}</button></div></div>`;
  // Pre-fill coletor if editing
  if(isEdit&&p.clienteId){updPdCol();setTimeout(()=>{const sel=document.getElementById('pd-col');if(sel&&p.coletorId){for(let i=0;i<sel.options.length;i++){if(sel.options[i].value===p.coletorId){sel.selectedIndex=i;break;}}}},100);}
}
window.novaProducao=function(){prodForm(null);};
window.editProducao=function(id){const p=DB.producao.find(x=>x.id===id);if(p)prodForm(p);};

window.updPdCol=function(){
  const clId=document.getElementById('pd-cl').value;
  const sel=document.getElementById('pd-col');
  sel.disabled=!clId;
  const cols=vcColetores.filter(c=>c.clienteId===clId);
  sel.innerHTML=`<option value="">Todos / Geral</option>${cols.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}`;
};

window.salvarProducao=async function(){
  const mesRef=document.getElementById('pd-mes').value;
  const tipo=document.getElementById('pd-tipo').value;
  const clSel=document.getElementById('pd-cl');
  const clienteId=clSel.value;
  const clienteNome=clSel.selectedOptions[0]?.textContent||clienteId;
  const colSel=document.getElementById('pd-col');
  const coletorId=colSel.value;
  const coletorNome=colSel.selectedOptions[0]?.textContent||'';
  const qt=parseInt(document.getElementById('pd-qt').value)||0;
  if(!mesRef||!clienteId||qt<=0)return alert('Preencha mês, cliente e quantidade');
  const vr=DB.valoresRelatorio.find(v=>v.clienteId===clienteId&&v.tipoRelatorio===tipo);
  const valorUnit=vr?vr.valorUnitario:0;
  const data={mesRef,tipoRelatorio:tipo,clienteId,clienteNome,coletorId,coletorNome:coletorId?coletorNome:'Geral',quantidade:qt,valorUnitario:valorUnit};
  if(window._editProdId){
    DB.producao=DB.producao.map(p=>p.id===window._editProdId?{...p,...data}:p);
    await saveDB('Produção editada',mesRef+' '+clienteNome+' '+qt+'x');
  }else{
    DB.producao.push({id:uid(),...data});
    // Auto-create or update faturamento
    const criarFat=document.getElementById('pd-fat')?.checked;
    if(criarFat){
      const valorTotal=qt*valorUnit;
      const fatExistente=DB.faturamento.find(f=>(normCl(f.clienteNorm||f.cliente))===normCl(clienteNome)&&f.mesRef===mesRef);
      if(fatExistente){
        // Update existing — add production value
        fatExistente.valorTotal+=valorTotal;
      }else{
        // Create new
        DB.faturamento.push({id:uid(),cliente:clienteNome,clienteNorm:clienteNome,mesRef,valorTotal,nf:'',envioMedicao:'',emissaoNF:'',prevPagamento:'',dataDeposito:'',status:'Pendente',obs:'',imposto:0,arquivos:[]});
      }
    }
    await saveDB('Produção lançada',mesRef+' '+clienteNome+' '+qt+'x'+(criarFat?' +fat':''));
  }
  window._editProdId='';renderProducao();
};

window.delProducao=async function(id){if(confirm('Excluir?')){DB.producao=DB.producao.filter(x=>x.id!==id);await saveDB('Produção excluída','');renderProducao();}};

window.editValores=function(){
  const el=document.getElementById('tab-producao');
  const clOpts=vcClientes.length?vcClientes.map(c=>`<option value="${c.id}" data-nome="${esc(c.nome)}">${esc(c.nome)}</option>`).join(''):CLIENTES.map(c=>`<option value="${esc(c)}" data-nome="${esc(c)}">${esc(c)}</option>`).join('');
  let h=`<div class="fc"><h3 style="margin:0 0 12px;font-size:16px;font-weight:700">💲 Valores por relatório</h3>

window.updValoresForm=function(){
  const clSel=document.getElementById('vr-cl');
  const clId=clSel.value;
  const clNome=clSel.selectedOptions[0]?.textContent||'';
  if(!clId){document.getElementById('vr-form').innerHTML='';return;}
  let h='';
  TIPOS_REL.forEach(tipo=>{
    const existing=DB.valoresRelatorio.find(v=>v.clienteId===clId&&v.tipoRelatorio===tipo);
    const val=existing?existing.valorUnitario.toFixed(2).replace('.',','):'';
    h+=`<div class="row" style="margin-bottom:6px"><div style="flex:1"><label class="lb">${tipo}</label><input class="inp vr-inp" data-tipo="${tipo}" value="${val}" placeholder="0,00" inputmode="decimal"></div></div>`;
  });

  document.getElementById('vr-form').innerHTML=h;

window.salvarValores=async function(clId,clNome){
  document.querySelectorAll('.vr-inp').forEach(inp=>{
    const tipo=inp.dataset.tipo;
    const val=parseBRL(inp.value);
    const idx=DB.valoresRelatorio.findIndex(v=>v.clienteId===clId&&v.tipoRelatorio===tipo);
    if(val>0){
      if(idx>=0)DB.valoresRelatorio[idx].valorUnitario=val;
      else DB.valoresRelatorio.push({clienteId:clId,clienteNome:clNome,tipoRelatorio:tipo,valorUnitario:val});
    }else if(idx>=0){DB.valoresRelatorio.splice(idx,1);}
  });
  await saveDB();
  alert('Valores salvos!');
};

window.gerarRelatorioPDF=async function(){
  // Load jsPDF + html2canvas
  const loadScript=(url)=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${url}"]`))return res();const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  }catch(e){alert('Erro ao carregar bibliotecas.');return;}
  try{
    // Hide options panel
    const opts=document.getElementById('rel-options');if(opts)opts.style.display='none';
    const tabEl=document.getElementById('tab-relatorio');
    const canvas=await html2canvas(tabEl,{backgroundColor:'#ffffff',scale:2,useCORS:true,scrollY:-window.scrollY});
    if(opts)opts.style.display='';
    const imgData=canvas.toDataURL('image/jpeg',0.95);
    const pdf=new jspdf.jsPDF({orientation:canvas.width>canvas.height?'l':'p',unit:'mm',format:'a4'});
    const pageW=pdf.internal.pageSize.getWidth();const pageH=pdf.internal.pageSize.getHeight();
    const imgW=pageW-20;const imgH=(canvas.height*imgW)/canvas.width;
    let yOff=10;let remaining=imgH;
    // Multi-page if needed
    while(remaining>0){
      pdf.addImage(imgData,'JPEG',10,yOff,imgW,imgH);
      remaining-=(pageH-20);
      if(remaining>0){pdf.addPage();yOff=-(imgH-remaining-10);}
    }
    const periodo=window._relMes.length?window._relMes.join('_'):'Todos';
    const cliente=window._relCl.length?window._relCl.join('_'):'Todos';
    pdf.save(`Relatorio_${cliente}_${periodo}.pdf`);
  }catch(e){console.error(e);alert('Erro ao gerar PDF.');}
};
